<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Almanac — Calendar &amp; Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF7;
    --bg-panel:#F3F0E8;
    --bg-panel-2:#EDE9DD;
    --ink:#1C2430;
    --ink-soft:#5B6472;
    --ink-faint:#9098A3;
    --line:#DDD8CC;
    --line-soft:#EAE6DA;
    --amber:#E8A33D;
    --amber-ink:#7A4E11;
    --sage:#4C6B5C;
    --sage-bg:#E3EAE4;
    --navy:#33465C;
    --navy-bg:#E4E8ED;
    --plum:#6B4C6B;
    --plum-bg:#EBE3EA;
    --white:#FFFFFF;
    --shadow: 0 1px 2px rgba(28,36,48,0.06), 0 4px 16px rgba(28,36,48,0.05);
    --shadow-lg: 0 8px 30px rgba(28,36,48,0.14);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Motion system: playful calendar interactions ---------- */
  :root{
    --ease-spring:cubic-bezier(.22,1,.36,1);
    --ease-smooth:cubic-bezier(.16,1,.3,1);
  }

  body{
    overflow-x:hidden;
  }

  .app{
    perspective:1400px;
    transform-style:preserve-3d;
  }

  .sidebar{
    animation:sidebarIn .72s var(--ease-spring) both;
    transform-origin:left center;
  }

  .brand .mark{
    animation:markPop .7s .12s var(--ease-spring) both;
  }

  .new-btn{
    position:relative;
    overflow:hidden;
  }

  .new-btn::after,
  .btn-primary::after,
  .auth-primary::after{
    content:"";
    position:absolute;
    width:90px;height:90px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    transform:scale(0);
    opacity:0;
    pointer-events:none;
  }

  .new-btn:active::after,
  .btn-primary:active::after,
  .auth-primary:active::after{
    animation:ripple .55s ease-out;
  }

  .main{
    animation:mainIn .7s var(--ease-spring) both;
    transform-origin:center top;
  }

  .topbar{
    animation:topbarIn .65s var(--ease-spring) both;
  }

  .topbar h2{
    animation:titleReveal .55s .08s var(--ease-spring) both;
  }

  .topbar-nav .icon-btn{
    transition:transform .22s var(--ease-spring), background .18s ease, color .18s ease;
  }
  .topbar-nav .icon-btn:hover{
    transform:translateY(-2px) scale(1.08);
  }
  .topbar-nav .icon-btn:active{
    transform:scale(.9);
  }

  .view-toggle{
    position:relative;
    isolation:isolate;
  }

  .view-toggle button{
    transition:color .22s ease, transform .22s var(--ease-spring);
  }
  .view-toggle button:hover{ transform:translateY(-1px); }
  .view-toggle button.active{
    animation:activeTab .42s var(--ease-spring) both;
  }

  .canvas{
    perspective:1400px;
  }

  .month-grid{
    animation:calendarIn .72s var(--ease-spring) both;
    transform-origin:50% 0;
  }

  .month-dow{
    animation:fadeSlideDown .45s var(--ease-smooth) both;
  }
  .month-dow:nth-child(2){animation-delay:.025s}
  .month-dow:nth-child(3){animation-delay:.05s}
  .month-dow:nth-child(4){animation-delay:.075s}
  .month-dow:nth-child(5){animation-delay:.10s}
  .month-dow:nth-child(6){animation-delay:.125s}
  .month-dow:nth-child(7){animation-delay:.15s}

  .month-cell{
    transform-origin:center center;
    animation:cellIn .52s var(--ease-spring) both;
    transition:
      background .22s ease,
      transform .28s var(--ease-spring),
      box-shadow .28s var(--ease-spring);
  }

  .month-cell:hover{
    background:#F8F6F0;
    transform:translateY(-3px) scale(1.008);
    z-index:3;
    box-shadow:0 8px 22px rgba(28,36,48,.07);
  }

  .month-cell:hover .date-num{
    transform:scale(1.12) rotate(-4deg);
  }

  .date-num{
    transition:transform .25s var(--ease-spring), color .2s ease;
  }

  .date-num.today::before{
    animation:todayOrbit 3.8s ease-in-out infinite;
  }

  .chip{
    transform-origin:left center;
    animation:chipIn .42s var(--ease-spring) both;
    transition:transform .2s var(--ease-spring), filter .2s ease, box-shadow .2s ease;
  }
  .chip:hover{
    transform:translateX(4px) scale(1.015);
    filter:saturate(1.08);
    box-shadow:0 3px 10px rgba(28,36,48,.08);
  }
  .chip:nth-child(2){animation-delay:.04s}
  .chip:nth-child(3){animation-delay:.08s}
  .chip:nth-child(4){animation-delay:.12s}

  .chip-more{
    animation:fadeIn .35s .15s ease both;
  }

  .mini{
    animation:miniIn .65s .16s var(--ease-spring) both;
  }

  .mini-day{
    transition:transform .2s var(--ease-spring), background .18s ease, color .18s ease;
  }
  .mini-day:hover{
    transform:scale(1.15);
    z-index:2;
  }
  .mini-day.selected{
    animation:selectedDayPop .5s var(--ease-spring) both;
  }

  .upcoming-item{
    animation:upcomingIn .45s var(--ease-spring) both;
    transition:transform .2s var(--ease-spring), background .18s ease, border-color .18s ease;
  }
  .upcoming-item:nth-child(2){animation-delay:.04s}
  .upcoming-item:nth-child(3){animation-delay:.08s}
  .upcoming-item:nth-child(4){animation-delay:.12s}
  .upcoming-item:nth-child(5){animation-delay:.16s}
  .upcoming-item:nth-child(6){animation-delay:.20s}
  .upcoming-item:nth-child(7){animation-delay:.24s}
  .upcoming-item:nth-child(8){animation-delay:.28s}
  .upcoming-item:hover{
    transform:translateX(5px);
  }

  .day-view{
    animation:dayViewIn .7s var(--ease-spring) both;
  }

  .hour-row{
    animation:hourIn .38s var(--ease-smooth) both;
  }
  .hour-row:nth-child(2n){animation-delay:.025s}
  .hour-row:nth-child(3n){animation-delay:.05s}
  .hour-row:nth-child(4n){animation-delay:.075s}

  .day-event{
    animation:eventFloatIn .55s var(--ease-spring) both;
    transition:
      transform .24s var(--ease-spring),
      box-shadow .24s var(--ease-spring),
      filter .24s ease;
  }
  .day-event:hover{
    transform:translateY(-3px) scale(1.012);
    filter:saturate(1.06);
    box-shadow:0 9px 22px rgba(28,36,48,.18);
  }

  .now-line{
    animation:nowPulse 2.2s ease-in-out infinite;
  }
  .now-line::before{
    animation:nowDot 1.8s ease-in-out infinite;
  }

  .overlay{
    animation:overlayIn .25s ease-out both;
    backdrop-filter:blur(3px);
  }

  .modal{
    animation:modalIn .58s var(--ease-spring) both;
    transform-origin:center 20%;
  }

  .modal .field,
  .modal .cat-picker,
  .modal .modal-actions{
    animation:formItemIn .42s var(--ease-spring) both;
  }
  .modal .field:nth-of-type(2){animation-delay:.035s}
  .modal .field:nth-of-type(3){animation-delay:.07s}
  .modal .field:nth-of-type(4){animation-delay:.105s}
  .modal .modal-actions{animation-delay:.14s}

  .cat-opt{
    transition:transform .2s var(--ease-spring), border-color .2s ease, background .2s ease;
  }
  .cat-opt:hover{ transform:translateY(-3px); }
  .cat-opt.selected{ animation:categoryPop .38s var(--ease-spring) both; }

  .app-toast{
    animation:toastIn .42s var(--ease-spring);
  }

  .auth-shell{
    animation:authBgIn .7s ease both;
  }
  .auth-card{
    animation:authCardIn .65s var(--ease-spring) both;
  }

  /* Navigation direction is added by JS to create a different slide rhythm. */
  .canvas.motion-next .month-grid,
  .canvas.motion-next .day-view{ animation-name:calendarNext; }
  .canvas.motion-prev .month-grid,
  .canvas.motion-prev .day-view{ animation-name:calendarPrev; }
  .canvas.motion-today .month-grid,
  .canvas.motion-today .day-view{ animation-name:calendarToday; }

  @keyframes sidebarIn{
    from{opacity:0;transform:translateX(-26px) rotateY(4deg)}
    to{opacity:1;transform:translateX(0) rotateY(0)}
  }
  @keyframes mainIn{
    from{opacity:0;transform:translateY(14px) scale(.992)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes topbarIn{
    from{opacity:0;transform:translateY(-14px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes titleReveal{
    from{opacity:0;transform:translateY(9px);filter:blur(5px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }
  @keyframes markPop{
    0%{opacity:0;transform:scale(.5) rotate(-35deg)}
    70%{transform:scale(1.13) rotate(5deg)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }
  @keyframes activeTab{
    0%{transform:scale(.88)}
    70%{transform:scale(1.06)}
    100%{transform:scale(1)}
  }
  @keyframes calendarIn{
    from{opacity:0;transform:translateY(22px) rotateX(5deg) scale(.985)}
    to{opacity:1;transform:none}
  }
  @keyframes calendarNext{
    from{opacity:0;transform:translateX(42px) rotateY(-2deg) scale(.985)}
    to{opacity:1;transform:none}
  }
  @keyframes calendarPrev{
    from{opacity:0;transform:translateX(-42px) rotateY(2deg) scale(.985)}
    to{opacity:1;transform:none}
  }
  @keyframes calendarToday{
    from{opacity:0;transform:scale(.94) rotateX(4deg)}
    65%{opacity:1;transform:scale(1.012) rotateX(0)}
    to{transform:none}
  }
  @keyframes fadeSlideDown{
    from{opacity:0;transform:translateY(-8px)}
    to{opacity:1;transform:none}
  }
  @keyframes cellIn{
    from{opacity:0;transform:translateY(13px) scale(.97)}
    to{opacity:1;transform:none}
  }
  @keyframes chipIn{
    from{opacity:0;transform:translateX(-10px) scale(.94)}
    to{opacity:1;transform:none}
  }
  @keyframes fadeIn{
    from{opacity:0}to{opacity:1}
  }
  @keyframes miniIn{
    from{opacity:0;transform:translateY(12px) scale(.98)}
    to{opacity:1;transform:none}
  }
  @keyframes selectedDayPop{
    0%{transform:scale(.75)}
    65%{transform:scale(1.13)}
    100%{transform:scale(1)}
  }
  @keyframes upcomingIn{
    from{opacity:0;transform:translateX(-12px)}
    to{opacity:1;transform:none}
  }
  @keyframes dayViewIn{
    from{opacity:0;transform:translateY(20px) scale(.99)}
    to{opacity:1;transform:none}
  }
  @keyframes hourIn{
    from{opacity:0;transform:translateX(8px)}
    to{opacity:1;transform:none}
  }
  @keyframes eventFloatIn{
    from{opacity:0;transform:translateY(12px) scale(.96)}
    to{opacity:1;transform:none}
  }
  @keyframes nowPulse{
    0%,100%{opacity:1}
    50%{opacity:.72}
  }
  @keyframes nowDot{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.35)}
  }
  @keyframes todayOrbit{
    0%,100%{transform:rotate(-4deg) scale(1)}
    50%{transform:rotate(2deg) scale(1.07)}
  }
  @keyframes overlayIn{
    from{opacity:0}to{opacity:1}
  }
  @keyframes modalIn{
    from{opacity:0;transform:translateY(28px) scale(.92) rotateX(-4deg)}
    70%{opacity:1;transform:translateY(-4px) scale(1.012) rotateX(0)}
    to{opacity:1;transform:none}
  }
  @keyframes formItemIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:none}
  }
  @keyframes categoryPop{
    from{transform:scale(.92)}
    65%{transform:scale(1.045)}
    to{transform:scale(1)}
  }
  @keyframes authBgIn{
    from{opacity:0}to{opacity:1}
  }
  @keyframes authCardIn{
    from{opacity:0;transform:translateY(24px) scale(.95)}
    to{opacity:1;transform:none}
  }
  @keyframes ripple{
    from{transform:scale(0);opacity:.7}
    to{transform:scale(3.4);opacity:0}
  }


  /* ---------- V2 visual direction: warm Dribbble + Lottie-inspired motion ---------- */
  :root{
    --bg:#F6D3B4; --bg-panel:#F9E8D6; --bg-panel-2:#F3C49C;
    --ink:#2F1508; --ink-soft:#70452F; --ink-faint:#A8785D;
    --line:#D9B294; --line-soft:#E9CDB6; --amber:#E8A02D; --amber-ink:#7D430C;
    --shadow:0 2px 5px rgba(47,21,8,.08),0 12px 34px rgba(47,21,8,.08);
    --shadow-lg:0 18px 60px rgba(47,21,8,.20); --white:#FFF9F2;
  }
  body{background:radial-gradient(circle at 82% 4%,rgba(255,255,255,.28),transparent 24%),linear-gradient(135deg,#F8D7B9 0%,#F6D3B4 52%,#F2C99F 100%);color:var(--ink);}
  .sidebar{background:rgba(249,232,214,.78);border-right:1px solid rgba(47,21,8,.12);backdrop-filter:blur(14px);}
  .brand .mark{background:var(--ink);color:#F9E8D6;box-shadow:0 8px 18px rgba(47,21,8,.15);}
  .new-btn{background:var(--ink);color:#FFF9F2;border-radius:12px;box-shadow:0 9px 20px rgba(47,21,8,.16);}
  .new-btn:hover{background:#4A210D;box-shadow:0 12px 26px rgba(47,21,8,.2);}
  .icon-btn:hover{background:rgba(47,21,8,.07);color:var(--ink);}
  .canvas{padding-top:14px;}
  .month-grid,.day-grid{border-color:rgba(47,21,8,.14);box-shadow:0 12px 35px rgba(47,21,8,.07);}
  .month-dow{background:rgba(249,232,214,.86);border-color:rgba(47,21,8,.13);color:var(--ink-faint);}
  .month-cell{background:rgba(255,249,242,.68);border-color:rgba(47,21,8,.13);}
  .month-cell.other-month{background:rgba(255,249,242,.42);}
  .month-cell:hover{background:rgba(255,250,245,.95);}
  .date-num.today{color:var(--amber-ink);}
  .date-num.today::before{border-color:#E8A02D;}
  .view-toggle{background:rgba(249,232,214,.8);box-shadow:inset 0 0 0 1px rgba(47,21,8,.07);}
  .view-toggle button.active{background:#FFF9F2;color:var(--ink);}
  .topbar .today-btn{border-color:rgba(47,21,8,.18);color:var(--ink-soft);}
  .day-grid{background:#FFF9F2;}
  .hour-label{background:#F9E8D6;border-color:rgba(47,21,8,.12);}
  .hour-row{border-color:#E9D4C0;}
  .hour-slot{border-left-color:rgba(47,21,8,.10);}
  .hour-slot:hover{background-color:#FFF3E6;}
  .modal{background:#FFF9F2;border:1px solid rgba(47,21,8,.10);}
  .overlay{background:rgba(47,21,8,.35);}
  .field input[type=text],.field textarea,.field input[type=date],.field input[type=time],.auth-field input{background:#FFF5EA;border-color:#D9B89C;}
  .cat-opt{background:#FFF5EA;border-color:#D9B89C;}
  .cat-opt.selected{background:#F7DFC6;border-color:var(--ink);}
  .btn-primary,.auth-primary{background:var(--ink);}
  .btn-primary:hover,.auth-primary:hover{background:#4A210D;}

  .new-event-icon{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:7px;background:rgba(255,255,255,.12);font-size:17px;transition:transform .35s var(--ease-spring),background .2s ease;}
  .new-btn:hover .new-event-icon{transform:rotate(90deg) scale(1.08);background:rgba(255,255,255,.2);}

  /* Warm, rounded hero card inspired by the referenced calendar artwork. */
  .day-spotlight{
    position:relative;min-height:188px;margin:0 30px 0;border:2px solid var(--ink);
    border-radius:24px;overflow:hidden;background:#FBE8D5;box-shadow:0 14px 34px rgba(47,21,8,.12);
    display:grid;grid-template-columns:minmax(220px,.72fr) minmax(360px,1.28fr);isolation:isolate;
    animation:spotlightIn .72s var(--ease-spring) both;
  }
  .spotlight-copy{position:relative;z-index:4;padding:22px 20px 18px 24px;display:flex;flex-direction:column;justify-content:center;}
  .spotlight-nav{display:flex;gap:8px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:9px;}
  .spotlight-kicker{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.12em;margin-bottom:3px;}
  .spotlight-weekday{font-size:13px;color:var(--ink-soft);}
  .spotlight-date{font-family:'Fraunces',serif;font-size:50px;line-height:.88;font-weight:700;letter-spacing:-.045em;color:var(--ink);margin:5px 0;}
  .spotlight-month{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:.12em;text-transform:uppercase;}
  .spotlight-events{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:13px;max-width:440px;}
  .spotlight-event{font-size:10px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;animation:spotEventIn .42s var(--ease-spring) both;}
  .spotlight-event::before{content:"";width:6px;height:6px;border-radius:50%;background:#E8A02D;flex:0 0 auto;}

  .spotlight-scene{position:relative;min-height:188px;overflow:hidden;background:linear-gradient(180deg,#F26A70 0%,#F48A54 28%,#F6B62D 63%,#E5A24C 100%);}
  .spotlight-scene::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 48% 50%,rgba(255,246,150,.88) 0 11%,rgba(255,229,92,.46) 12%,transparent 24%);mix-blend-mode:screen;animation:sceneGlow 4.5s ease-in-out infinite;}
  .sun{position:absolute;width:72px;height:72px;border-radius:50%;left:42%;top:28%;background:#FFF06B;box-shadow:0 0 28px rgba(255,242,108,.65),0 0 70px rgba(255,226,82,.35);animation:sunFloat 4.8s ease-in-out infinite;}
  .cloud{position:absolute;width:92px;height:24px;border-radius:20px;background:rgba(255,255,255,.9);filter:drop-shadow(0 5px 5px rgba(124,67,12,.08));animation:cloudDrift 8s ease-in-out infinite;}
  .cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit;}
  .cloud::before{width:34px;height:34px;left:15px;top:-15px}.cloud::after{width:27px;height:27px;left:43px;top:-10px}
  .cloud.one{left:8%;top:23%;transform:scale(.74)}.cloud.two{right:7%;top:13%;transform:scale(.5);animation-delay:-3.2s}
  .hill{position:absolute;left:-10%;right:-10%;bottom:-58px;height:120px;border-radius:50% 50% 0 0;background:#B76C1E;transform:rotate(-3deg);animation:hillParallax 6s ease-in-out infinite;}
  .hill.back{bottom:-40px;background:#D58B2B;transform:rotate(4deg) scale(1.06);animation-delay:-1.7s}
  .hill.front{bottom:-74px;background:#8D5215;transform:rotate(-7deg) scale(1.12);animation-delay:-3s}
  .tree{position:absolute;bottom:42px;width:10px;height:48px;background:#5D350D;border-radius:8px 8px 2px 2px;transform-origin:bottom center;animation:treeSway 3.8s ease-in-out infinite;}
  .tree::before{content:"";position:absolute;width:22px;height:30px;left:-6px;top:-17px;background:#5D350D;border-radius:50% 50% 40% 40%}
  .tree.a{left:27%;transform:scale(.75)}.tree.b{left:63%;transform:scale(1.1);animation-delay:-1.2s}.tree.c{left:77%;transform:scale(.62);animation-delay:-2.3s}
  .scene-caption{position:absolute;z-index:5;right:18px;top:18px;color:#FFF8E8;text-align:right;text-shadow:0 2px 10px rgba(75,33,5,.18);}
  .scene-temp{font-family:'Fraunces',serif;font-size:38px;font-weight:600;line-height:1}.scene-temp span{font-size:18px;vertical-align:top;margin-left:2px}
  .scene-meta{margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;}
  .spotlight-weather-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#FFF06B;margin-right:5px;animation:weatherDot 1.7s ease-in-out infinite;}

  .day-spotlight.motion-next{animation-name:spotlightNext}.day-spotlight.motion-prev{animation-name:spotlightPrev}.day-spotlight.motion-today{animation-name:spotlightToday}
  @keyframes spotlightIn{from{opacity:0;transform:translateY(20px) scale(.985)}70%{opacity:1;transform:translateY(-3px) scale(1.005)}to{transform:none}}
  @keyframes spotlightNext{from{opacity:0;transform:translateX(38px) scale(.985)}65%{opacity:1;transform:translateX(-3px) scale(1.004)}to{transform:none}}
  @keyframes spotlightPrev{from{opacity:0;transform:translateX(-38px) scale(.985)}65%{opacity:1;transform:translateX(3px) scale(1.004)}to{transform:none}}
  @keyframes spotlightToday{from{opacity:0;transform:scale(.94) rotateX(3deg)}65%{opacity:1;transform:scale(1.012)}to{transform:none}}
  @keyframes spotEventIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes sceneGlow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
  @keyframes sunFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.045)}}
  @keyframes cloudDrift{0%,100%{margin-left:0}50%{margin-left:18px}}
  @keyframes hillParallax{0%,100%{transform:translateX(0) rotate(-3deg)}50%{transform:translateX(12px) rotate(-1deg)}}
  @keyframes treeSway{0%,100%{margin-left:0;transform:rotate(-1deg)}50%{margin-left:2px;transform:rotate(2deg)}}

  /* mini month */

    font-weight:600;

  }
  .mini-nav{ display:flex; gap:2px; }
  .icon-btn{
    background:none;border:none;color:var(--ink-soft);

  }
  .icon-btn:hover{ background:var(--bg-panel-2); color:var(--ink); }

    display:grid;

  .legend{
    display:flex; flex-direction:column; gap:9px;
  }
  .legend .title{
    font-family:'IBM Plex Mono', monospace;

  }

  .upcoming{ display:flex; flex-direction:column; gap:10px; flex:1; overflow:hidden; }
  .upcoming .title{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .upcoming-list{ display:flex; flex-direction:column; gap:6px; overflow-y:auto; }
  .upcoming-item{
    display:flex; gap:9px; align-items:flex-start;

    border:1px solid transparent;
  }

  /* ---------- Main ---------- */
  .main{ display:flex; flex-direction:column; min-height:100vh; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 30px 18px 30px;
    border-bottom:1px solid var(--line);
    gap:16px; flex-wrap:wrap;
  }
  .topbar-left{ display:flex; align-items:baseline; gap:14px; }
  .topbar h2{

    font-weight:600;
    font-size:28px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .topbar .today-btn{

  .view-toggle{
    display:flex; background:var(--bg-panel); border-radius:8px; padding:3px; gap:2px;
  }
  .view-toggle button{
    border:none; background:none; padding:7px 14px; border-radius:6px;

    color:var(--ink-soft); cursor:pointer;

  .canvas{ flex:1; padding:8px 30px 30px 30px; overflow:auto; }

  /* ---- Month view ---- */
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  .month-dow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:0.06em;
    color:var(--ink-faint);
    padding:8px 10px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:var(--bg-panel);
  }
  .month-cell{
    min-height:112px;
    border-right:1px solid var(--line);

    display:flex; flex-direction:column; gap:4px;

  }

  .month-cell.other-month .date-num{ color:var(--ink-faint); opacity:0.55; }
  .date-num{

  .cat-work{ background:var(--navy-bg); color:var(--navy); }

  .swatch-work{ background:var(--navy); }
  .swatch-personal{ background:var(--sage); }
  .swatch-focus{ background:var(--amber); }
  .swatch-other{ background:var(--plum); }
  .bar-work{ background:var(--navy); }
  .bar-personal{ background:var(--sage); }
  .bar-focus{ background:var(--amber); }

  /* ---- Day view ---- */
  .day-view{
    display:block;
    width:100%;
    min-width:0;
  }

    position:relative;
    width:100%;
    min-width:900px;
    border-top:1px solid var(--line);

  .overlay{

  .btn{

  .btn-primary{ background:var(--ink); color:var(--bg); }

  .btn-danger{ background:none; color:#A6432F; }

  .err{ color:#A6432F; font-size:11.5px; margin-top:-8px; margin-bottom:12px; }

    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 42px;
    position:relative;
    z-index:20;
  }

  .auth-card{
    width:100%;
    max-width:390px;
    background:transparent;
    border:0;
    box-shadow:none;
    padding:0;
    animation:authCardIn .7s .12s var(--ease-spring) both;
  }

  .auth-title{
    font-family:'Fraunces',serif;
    font-size:42px;
    line-height:1;
    letter-spacing:-.045em;
    color:#2F1508;
    margin:0 0 10px;
  }

  .auth-copy{
    font-size:12px;
    line-height:1.65;
    color:#8B624C;
    margin:0 0 28px;
    max-width:320px;
  }

  .auth-error{
    color:#A6432F;
    background:#FCEDEA;
    border:1px solid #EBC9C1;
    border-radius:10px;
    padding:10px 12px;
    font-size:11px;
    margin-bottom:14px;
    animation:errorShake .42s ease both;
  }

  .google-login-btn{
    width:100%;
    min-height:56px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:11px;
    background:#2F1508;
    color:#FFF8ED;
    border:0;
    border-radius:14px;
    padding:12px 18px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 12px 25px rgba(47,21,8,.16);
    transition:transform .25s var(--ease-spring),box-shadow .25s ease,background .2s ease;
    position:relative;
    overflow:hidden;
  }

  .google-login-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 17px 31px rgba(47,21,8,.2);
    background:#47200D;
  }

  .google-login-btn:active{transform:translateY(0) scale(.985);}
  .google-login-btn.busy{cursor:wait;opacity:.92;}

  .google-icon{
    width:22px;height:22px;
    border-radius:50%;
    background:#FFF;
    color:#4285F4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    font-weight:800;
    font-size:15px;
    flex:0 0 auto;
  }

  .google-login-btn.busy .google-icon{animation:googleSpin .8s linear infinite;}

  .google-login-label{
    display:inline-block;
    min-width:150px;
    text-align:left;
  }

  .google-login-btn.busy .google-login-label{
    animation:loginTextPulse 1.2s ease-in-out infinite;
  }

  .auth-helper{
    margin-top:17px;
    font-family:'IBM Plex Mono',monospace;
    color:#A07861;
    font-size:8.5px;
    line-height:1.6;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  .auth-security{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:28px;
    font-size:10px;
    color:#A07861;
  }

  .auth-security::before{
    content:"";
    width:7px;height:7px;
    border-radius:50%;
    background:#67A36E;
    box-shadow:0 0 0 4px #E7F0E4;
  }

  @keyframes loginAura{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(2%,3%) scale(1.06)}}
  @keyframes loginBrandIn{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:none}}
  @keyframes loginCopyIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes calendarFloat{0%,100%{transform:rotate(5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-11px)}}
  @keyframes noteFloat{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-9px)}}
  @keyframes calendarDotIn{from{opacity:0;transform:scale(.4) rotate(-10deg)}to{opacity:1;transform:none}}
  @keyframes errorShake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:none}}
  @keyframes googleSpin{to{transform:rotate(360deg)}}
  @keyframes loginTextPulse{0%,100%{opacity:.72}50%{opacity:1}}

  @media(max-width:1050px){
    .auth-shell{grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);}
    .auth-visual{padding-left:38px;padding-right:38px;}
    .login-calendar-card{right:5%;width:330px;}
    .auth-visual-copy{width:60vw;}
    .auth-visual-copy h2{font-size:clamp(50px,5.5vw,70px);}
  }

  @media(max-width:800px){
    .auth-shell{grid-template-columns:1fr;}
    .auth-visual{min-height:580px;padding:30px 28px;}
    .auth-visual-copy{width:min(600px,90vw);margin-top:95px;}
    .auth-visual-copy h2{font-size:54px;}
    .login-calendar-card{top:51%;right:6%;width:330px;height:235px;}
    .login-note{left:8%;bottom:4%;}
    .auth-form-panel{min-height:430px;padding:42px 28px 52px;}
  }

  @media(max-width:520px){
    .auth-visual{min-height:510px;padding:24px 20px;}
    .auth-brand h1{font-size:21px;}
    .auth-visual-copy{margin-top:72px;}
    .auth-kicker{font-size:8px;margin-bottom:12px;}
    .auth-visual-copy h2{font-size:43px;max-width:360px;}
    .auth-visual-copy p{font-size:11px;margin-top:18px;max-width:330px;}
    .login-calendar-card{top:57%;right:-2%;width:285px;height:190px;}
    .login-cal-title{font-size:21px;top:31px;}
    .login-cal-month{top:35px;}
    .login-cal-grid{top:70px;gap:5px;}
    .login-note{left:4%;bottom:3%;width:165px;padding:14px;}
    .login-note strong{font-size:17px;}
    .auth-form-panel{padding:36px 22px 45px;}
    .auth-title{font-size:35px;}
  }

  .user-area{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;}
  .user-email{font-size:10.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}
  .logout-btn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--ink-soft);padding:5px 8px;font-size:10.5px;font-weight:600;cursor:pointer;}
  .logout-btn:hover{color:var(--ink);border-color:var(--ink-soft);}


  .app-toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    z-index:10001;
    background:var(--ink);
    color:var(--bg);
    border-radius:8px;
    padding:10px 16px;
    box-shadow:var(--shadow-lg);
    font-size:12px;
    font-weight:600;
    letter-spacing:.1px;
    animation:toastIn .18s ease-out;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>

<body>

<div class="app" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  initializeAuth, browserLocalPersistence, browserSessionPersistence,
  browserPopupRedirectResolver, onAuthStateChanged,
  signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  initializeFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCG1VUXp4U1_lIeGHqAAIC2Zo6bZYZJUzY",
  authDomain: "calendar-app-cf088.firebaseapp.com",
  projectId: "calendar-app-cf088",
  storageBucket: "calendar-app-cf088.firebasestorage.app",
  messagingSenderId: "900092970911",
  appId: "1:900092970911:web:1edd0c8eca1acd7efd1faa"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = initializeAuth(firebaseApp, {
  persistence: [browserLocalPersistence, browserSessionPersistence],
  popupRedirectResolver: browserPopupRedirectResolver
});
const db = initializeFirestore(firebaseApp, {
  experimentalForceLongPolling: true
});
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({prompt:"select_account"});

(function(){
  "use strict";

  const CATS = {
    work:    { label:"Work",     cls:"work" },
    personal:{ label:"Personal", cls:"personal" },
    focus:   { label:"Focus",    cls:"focus" },
    other:   { label:"Other",    cls:"other" },
  };

  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function uid(){ return "ev_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function fmtTime(t){
    if(!t) return "";
    let [h,m] = t.split(":").map(Number);
    const ap = h>=12 ? "PM":"AM";
    h = h%12; if(h===0) h=12;
    return h+":"+pad(m)+ap;
  }
  function timeToMinutes(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }

  const state = {
    events: [],           // {id, title, date:"YYYY-MM-DD", start:"HH:MM", end:"HH:MM", category, notes}
    view: "month",        // "month" | "day"
    motion:"none",           // "next" | "prev" | "today" | "none"
    cursor: new Date(),   // month being viewed / selected day
    selectedDay: new Date(),
    loaded:false,
    editing:null,         // event being edited, or null for new
    modalOpen:false,
    modalDefaults:null,
        authError:null,
    authBusy:false,
    toast:"",
    toastTimer:null,
  };

  function eventsCollection(){
    if(!auth.currentUser) throw new Error("You must be signed in.");
    return collection(db, "users", auth.currentUser.uid, "events");
  }

  async function loadEvents(){
    if(!auth.currentUser) return;
    state.loaded = false;
    try{
      const snapshot = await getDocs(eventsCollection());
      state.events = snapshot.docs.map(d=>({id:d.id, ...d.data()}));
    }catch(e){
      console.error("Could not load events:", e);
      state.events = [];
      state.modalError = "Firestore could not connect. Please check your Internet/VPN/firewall and try again.";
    }
    state.loaded = true;
    render();
  }

  async function upsertEvent(ev){
    if(!auth.currentUser){
      state.modalError = "Please sign in before saving an event.";
      return false;
    }
    try{
      if(ev.id && state.events.some(e=>e.id===ev.id)){
        const eventRef = doc(db, "users", auth.currentUser.uid, "events", ev.id);
        const {id, ...data} = ev;
        await updateDoc(eventRef, {...data, updatedAt:serverTimestamp()});
        const idx = state.events.findIndex(e=>e.id===ev.id);
        if(idx>=0) state.events[idx] = ev;
      }else{
        const {id, ...data} = ev;
        const ref = await addDoc(eventsCollection(), {
          ...data,
          createdAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        });
        ev.id = ref.id;
        state.events.push(ev);
      }
      state.modalError = null;
      return true;
    }catch(e){
      console.error("Could not save event:", e);
      state.modalError = e?.code === "unavailable"
        ? "Firestore is temporarily unreachable. Please check your Internet/VPN/firewall and try again."
        : "Could not save this event. Check Firestore Security Rules.";
      return false;
    }
  }

  async function deleteEvent(id){
    if(!auth.currentUser){
      state.modalError = "Please sign in before deleting an event.";
      return false;
    }
    try{
      await deleteDoc(doc(db, "users", auth.currentUser.uid, "events", id));
      state.events = state.events.filter(e=>e.id!==id);
      state.modalError = null;
      return true;
    }catch(e){
      console.error("Could not delete event:", e);
      state.modalError = e?.code === "unavailable"
        ? "Firestore is temporarily unreachable. Please try again."
        : "Could not delete this event. Check Firestore Security Rules.";
      return false;
    }
  }

  function eventsOn(key){
    return state.events.filter(e=>e.date===key).sort((a,b)=> (a.start||"").localeCompare(b.start||""));
  }

  /* ---------------- Rendering ---------------- */


  function clearOverlay(){
    document.querySelectorAll('.overlay').forEach(node=>node.remove());
  }

  function showToast(message){
    state.toast = message;
    if(state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(()=>{
      state.toast = "";
      state.toastTimer = null;
      render();
    }, 2200);
  }

  function render(){
    clearOverlay();
    const app = document.getElementById('app');
    app.innerHTML = "";
    if(!auth.currentUser){
      app.className = "app auth-app";
      app.appendChild(renderAuth());
      return;
    }
    app.className = "app";
    app.appendChild(renderSidebar());
    app.appendChild(renderMain());
    if(state.modalOpen) app.appendChild(renderModal());
    if(state.toast){
      app.appendChild(el('div',{class:'app-toast'},[txt(state.toast)]));
    }
  }

  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if(children) children.forEach(c=> c && e.appendChild(c));
    return e;
  }
  function txt(t){ return document.createTextNode(t); }


  function friendlyAuthError(error){
    const code = error?.code || "";
    const messages = {
      "auth/invalid-credential":"Google could not verify this sign-in. Please try again.",
      "auth/invalid-email":"Google returned an invalid account identity. Please try again.",
      "auth/account-exists-with-different-credential":"This Google account is already linked to another sign-in method.",
      "auth/operation-not-allowed":"Google sign-in is not enabled in your Firebase Authentication settings.",
      "auth/network-request-failed":"Network error while contacting Google. Please check your connection.",
      "auth/popup-closed-by-user":"Google sign-in was cancelled. Please try again.",
      "auth/cancelled-popup-request":"A Google sign-in request was already in progress. Please try again.",
      "auth/popup-blocked":"Google sign-in was blocked by the browser. Please try again.",
      "auth/too-many-requests":"Too many attempts. Please try again later."
    };
    return messages[code] || error?.message || "Authentication failed.";
  }

  function renderAuth(){
    const shell = el('div',{class:'auth-shell'});

    const visual = el('section',{class:'auth-visual'},[
      el('div',{class:'auth-brand'},[
        el('div',{class:'mark'},[txt('A')]),
        el('div',{},[
          el('h1',{},[txt('Almanac')]),
          el('div',{class:'auth-sub'},[txt('CALENDAR · SCHEDULER')])
        ])
      ]),
      el('div',{class:'auth-visual-copy'},[
        el('div',{class:'auth-kicker'},[txt('YOUR TIME · YOUR SPACE')]),
        el('h2',{},[txt('Make time for what matters.')]),
        el('p',{},[txt('Plan your days, keep your events close, and let your calendar move with you.')])
      ])
    ]);

    const scene = el('div',{class:'auth-scene'});
    const calGrid = el('div',{class:'login-cal-grid'});
    for(let i=0;i<35;i++){
      calGrid.appendChild(el('i',{style:`animation-delay:${Math.min(i*.018,.55)}s`}));
    }
    const cal = el('div',{class:'login-calendar-card'},[
      el('div',{class:'login-cal-title'},[txt('August')]),
      el('div',{class:'login-cal-month'},[txt('2026 · PLAN')]),
      calGrid
    ]);
    scene.appendChild(cal);
    scene.appendChild(el('div',{class:'login-note'},[
      el('div',{class:'small'},[txt('TODAY · FOCUS')]),
      el('strong',{},[txt('Your day, organized.')]),
      el('span',{},[txt('One calm place for every plan.')])
    ]));
    visual.appendChild(scene);

    const panel = el('section',{class:'auth-form-panel'});
    const card = el('div',{class:'auth-card'});

    card.appendChild(el('h2',{class:'auth-title'},[txt('Welcome back.')]));
    card.appendChild(el('p',{class:'auth-copy'},[
      txt('Sign in securely with your Google Account to access your cloud calendar.')
    ]));

    if(state.authError){
      card.appendChild(el('div',{class:'auth-error'},[txt(state.authError)]));
    }

    const googleButton = el('button',{
      class:'google-login-btn',
      type:'button',
      onclick:async()=>{
        if(state.authBusy) return;

        // Synchronous visual feedback proves the click handler fired.
        state.authBusy = true;
        state.authError = null;
        googleButton.disabled = true;
        googleButton.classList.add('busy');
        googleButton.querySelector('.google-login-label').textContent = 'Opening Google…';

        try{
          const result = await signInWithPopup(
            auth,
            googleProvider,
            browserPopupRedirectResolver
          );

          // Firebase has authenticated the Google account.
          state.authBusy = false;
          state.authError = null;

          if(result?.user){
            render();
          }
        }catch(error){
          console.error('Google authentication error:', error);

          // If a browser blocks the popup, use redirect authentication.
          if(error?.code === 'auth/popup-blocked'){
            try{
              await signInWithRedirect(
                auth,
                googleProvider,
                browserPopupRedirectResolver
              );
              return;
            }catch(redirectError){
              console.error('Google redirect authentication error:', redirectError);
              error = redirectError;
            }
          }

          state.authBusy = false;
          state.authError = friendlyAuthError(error);
          render();
        }
      }
    },[
      el('span',{class:'google-icon'},[txt('G')]),
      el('span',{class:'google-login-label'},[txt('Continue with Google')])
    ]);

    card.appendChild(googleButton);

    card.appendChild(el('div',{class:'auth-helper'},[
      txt('Use your Google Account · No password required')
    ]));

    card.appendChild(el('div',{class:'auth-security'},[
      txt('SECURE FIREBASE AUTHENTICATION')
    ]));

    panel.appendChild(card);
    shell.appendChild(visual);
    shell.appendChild(panel);
    return shell;
  }


  function renderSidebar(){
    const sb = el('div',{class:'sidebar'});

    // brand
    sb.appendChild(el('div',{class:'brand'},[
      el('div',{class:'mark'},[txt('A')]),
      el('div',{},[
        el('h1',{},[txt('Almanac')]),
        el('div',{class:'sub'},[txt('CALENDAR · SCHEDULER')])
      ])
    ]));

    // new event
    sb.appendChild(el('button',{class:'new-btn', type:'button', onclick:()=>openModal(null, state.selectedDay)},[
      el('span',{class:'new-event-icon'},[txt('+')]), el('span',{},[txt('New event')])
    ]));

    // mini month
    sb.appendChild(renderMiniMonth());

    // legend
    const legend = el('div',{class:'legend'},[el('div',{class:'title'},[txt('Categories')])]);
    Object.keys(CATS).forEach(k=>{
      legend.appendChild(el('div',{class:'legend-row'},[
        el('span',{class:'legend-swatch swatch-'+CATS[k].cls}),
        txt(CATS[k].label)
      ]));
    });
    sb.appendChild(legend);

    // upcoming
    sb.appendChild(renderUpcoming());

    sb.appendChild(el('div',{class:'user-area'},[
      el('div',{class:'user-email',title:auth.currentUser?.displayName||auth.currentUser?.email||""},[txt(auth.currentUser?.displayName||"Google account")]),
      el('button',{class:'logout-btn',onclick:async()=>{await signOut(auth);}},[txt('Sign out')])
    ]));

    return sb;
  }

  function renderMiniMonth(){
    const wrap = el('div',{class:'mini'});
    const cur = state.cursor;
    const y = cur.getFullYear(), m = cur.getMonth();
    wrap.appendChild(el('div',{class:'mini-head'},[
      el('div',{class:'label'},[txt(MONTHS[m]+" "+y)]),
      el('div',{class:'mini-nav'},[
        el('button',{class:'icon-btn', 'aria-label':'Previous month', onclick:()=>{ state.cursor = new Date(y,m-1,1); state.motion='prev'; render(); }},[txt('‹')]),
        el('button',{class:'icon-btn', 'aria-label':'Next month', onclick:()=>{ state.cursor = new Date(y,m+1,1); state.motion='next'; render(); }},[txt('›')]),
      ])
    ]));

    const grid = el('div',{class:'mini-grid'});
    DOW.forEach(d=> grid.appendChild(el('div',{class:'mini-dow'},[txt(d[0])])));

    const firstOfMonth = new Date(y,m,1);
    const startOffset = firstOfMonth.getDay();
    const gridStart = new Date(y,m,1-startOffset);
    const today = new Date();

    for(let i=0;i<42;i++){
      const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      const key = dateKey(d);
      const isOther = d.getMonth()!==m;
      const isToday = sameDay(d, today);
      const isSelected = sameDay(d, state.selectedDay);
      const hasEvents = eventsOn(key).length>0;
      const cell = el('div',{
        class:'mini-day'+(isOther?' other-month':'')+(isSelected?' selected':'')+(isToday?' today':''),
        onclick:()=>{ state.selectedDay = d; state.cursor = new Date(d.getFullYear(), d.getMonth(), 1); state.view='day'; render(); }
      },[txt(d.getDate())]);
      if(hasEvents) cell.appendChild(el('span',{class:'dot'}));
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    return wrap;
  }

  function renderUpcoming(){
    const wrap = el('div',{class:'upcoming'},[el('div',{class:'title'},[txt('Upcoming')])]);
    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = state.events
      .filter(e=>{ const d = parseKey(e.date); return d>=today; })
      .sort((a,b)=> (a.date+((a.start)||"00:00")).localeCompare(b.date+((b.start)||"00:00")))
      .slice(0,8);

    const list = el('div',{class:'upcoming-list'});
    if(upcoming.length===0){
      list.appendChild(el('div',{class:'upcoming-empty'},[txt('Nothing scheduled. Add your first event.')]));
    } else {
      upcoming.forEach(ev=>{
        const d = parseKey(ev.date);
        const isToday = sameDay(d,new Date());
        const whenStr = (isToday?"Today":d.toLocaleDateString(undefined,{month:'short', day:'numeric'})) + (ev.start? " · "+fmtTime(ev.start) : "");
        list.appendChild(el('div',{class:'upcoming-item', onclick:()=>openModal(ev)},[
          el('span',{class:'bar bar-'+CATS[ev.category].cls}),
          el('div',{class:'txt'},[
            el('div',{class:'when'},[txt(whenStr)]),
            el('div',{class:'what'},[txt(ev.title)]),
          ])
        ]));
      });
    }
    wrap.appendChild(list);
    return wrap;
  }


  function renderDaySpotlight(){
    const d = state.selectedDay || new Date();
    const dayEvents = eventsOn(dateKey(d)).slice(0,4);
    const weather = [
      {temp:"28°", meta:"DAY 28° · NIGHT 14°", desc:"PARTLY CLOUDY"},
      {temp:"27°", meta:"DAY 27° · NIGHT 15°", desc:"SUNNY"},
      {temp:"29°", meta:"DAY 29° · NIGHT 16°", desc:"CLEAR SKY"},
      {temp:"26°", meta:"DAY 26° · NIGHT 13°", desc:"SOFT CLOUDS"}
    ][(d.getDate()+d.getMonth())%4];

    const card = el('section',{class:'day-spotlight','aria-label':'Selected day spotlight'});
    card.classList.add(state.motion==='next'?'motion-next':state.motion==='prev'?'motion-prev':'motion-today');

    const copy = el('div',{class:'spotlight-copy'},[
      el('div',{class:'spotlight-nav'},[
        txt(state.view==='month'?'CALENDAR · MONTH':'CALENDAR · DAY'),txt('·'),txt('SELECTED DATE')
      ]),
      el('div',{class:'spotlight-kicker'},[txt('Your day')]),
      el('div',{class:'spotlight-weekday'},[txt(d.toLocaleDateString(undefined,{weekday:'long'}))]),
      el('div',{class:'spotlight-date'},[txt(String(d.getDate()))]),
      el('div',{class:'spotlight-month'},[txt(d.toLocaleDateString(undefined,{month:'long',year:'numeric'}))])
    ]);

    const eventWrap = el('div',{class:'spotlight-events'});
    if(dayEvents.length){
      dayEvents.forEach((ev,i)=>eventWrap.appendChild(el('div',{class:'spotlight-event',style:`animation-delay:${.18+i*.06}s`},[txt(ev.title)])));
    }else{
      eventWrap.appendChild(el('div',{class:'spotlight-event'},[txt('No events scheduled')]));
    }
    copy.appendChild(eventWrap);

    const scene = el('div',{class:'spotlight-scene'},[
      el('div',{class:'cloud one'}),el('div',{class:'cloud two'}),el('div',{class:'sun'}),
      el('div',{class:'hill back'}),el('div',{class:'hill'}),el('div',{class:'hill front'}),
      el('div',{class:'tree a'}),el('div',{class:'tree b'}),el('div',{class:'tree c'}),
      el('div',{class:'scene-caption'},[
        el('div',{class:'scene-temp'},[txt(weather.temp),el('span',{},[txt('C')])]),
        el('div',{class:'scene-meta'},[el('span',{class:'spotlight-weather-dot'}),txt(weather.desc),el('br'),txt(weather.meta)])
      ])
    ]);

    card.appendChild(copy); card.appendChild(scene);
    return card;
  }

  function renderMain(){
    const main = el('div',{class:'main'});
    main.appendChild(renderTopbar());
    main.appendChild(renderDaySpotlight());
    const canvas = el('div',{class:'canvas'});
    if(!state.loaded){
      canvas.appendChild(el('div',{class:'empty-state'},[txt('Loading your calendar…')]));
    } else if(state.view==='month'){
      if(state.motion && state.motion!=='none') canvas.classList.add('motion-'+state.motion);
      canvas.appendChild(renderMonthGrid());
    } else {
      if(state.motion && state.motion!=='none') canvas.classList.add('motion-'+state.motion);
      canvas.appendChild(renderDayView());
    }
    state.motion = 'none';
    main.appendChild(canvas);
    return main;
  }

  function renderTopbar(){
    const top = el('div',{class:'topbar'});
    let titleStr;
    if(state.view==='month'){
      titleStr = MONTHS[state.cursor.getMonth()]+" "+state.cursor.getFullYear();
    } else {
      titleStr = state.selectedDay.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
    }
    const left = el('div',{class:'topbar-left'},[
      el('h2',{},[txt(titleStr)]),
      el('button',{class:'today-btn', onclick:()=>{
        const t = new Date();
        state.cursor = new Date(t.getFullYear(), t.getMonth(),1);
        state.selectedDay = t;
        render();
        state.motion='today';
        render();
      }},[txt('Today')]),
      el('div',{class:'topbar-nav'},[
        el('button',{class:'icon-btn', 'aria-label':'Previous', onclick:()=> step(-1)},[txt('‹')]),
        el('button',{class:'icon-btn', 'aria-label':'Next', onclick:()=> step(1)},[txt('›')]),
      ])
    ]);
    const toggle = el('div',{class:'view-toggle'},[
      el('button',{class:'view-btn'+(state.view==='month'?' active':''), onclick:()=>{state.motion='today'; state.view='month'; render();}},[txt('Month')]),
      el('button',{class:'view-btn'+(state.view==='day'?' active':''), onclick:()=>{state.motion='today'; state.view='day'; render();}},[txt('Day')]),
    ]);
    top.appendChild(left);
    top.appendChild(toggle);
    return top;
  }

  function step(dir){
    state.motion = dir > 0 ? 'next' : 'prev';
    if(state.view==='month'){
      state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth()+dir, 1);
    } else {
      const d = new Date(state.selectedDay);
      d.setDate(d.getDate()+dir);
      state.selectedDay = d;
      state.cursor = new Date(d.getFullYear(), d.getMonth(),1);
    }
    render();
  }

  function renderMonthGrid(){
    const wrap = el('div',{});
    const grid = el('div',{class:'month-grid'});
    DOW.forEach(d=> grid.appendChild(el('div',{class:'month-dow'},[txt(d)])));

    const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
    const firstOfMonth = new Date(y,m,1);
    const startOffset = firstOfMonth.getDay();
    const gridStart = new Date(y,m,1-startOffset);
    const today = new Date();

    for(let i=0;i<42;i++){
      const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      const key = dateKey(d);
      const isOther = d.getMonth()!==m;
      const isToday = sameDay(d, today);
      const dayEvents = eventsOn(key);

      const cell = el('div',{
        class:'month-cell'+(isOther?' other-month':''),
        style:`animation-delay:${Math.min(i*0.018,0.48)}s`,
        onclick:()=>{ state.selectedDay=d; state.view='day'; state.motion='today'; render(); }
      });
      cell.appendChild(el('div',{class:'date-num'+(isToday?' today':'')},[txt(d.getDate())]));

      const evWrap = el('div',{class:'cell-events'});
      const shown = dayEvents.slice(0,3);
      shown.forEach(ev=>{
        const chip = el('div',{class:'chip cat-'+CATS[ev.category].cls, onclick:(e)=>{ e.stopPropagation(); openModal(ev); }},[]);
        if(ev.start) chip.appendChild(el('span',{class:'t'},[txt(fmtTime(ev.start).replace(':00',''))]));
        chip.appendChild(el('span',{},[txt(ev.title)]));
        evWrap.appendChild(chip);
      });
      if(dayEvents.length>3){
        evWrap.appendChild(el('div',{class:'chip-more'},[txt('+'+(dayEvents.length-3)+' more')]));
      }
      cell.appendChild(evWrap);
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    return wrap;
  }

  function renderDayView(){
    const wrap = el('div',{class:'day-view'});
    const key = dateKey(state.selectedDay);
    const dayEvents = eventsOn(key);

    const grid = el('div',{class:'day-grid'});
    const startHour = 6, endHour = 23;
    const rowHeight = 56;
    const labelWidth = 76;

    for(let h=startHour; h<=endHour; h++){
      const row = el('div',{class:'hour-row'});
      row.appendChild(el('div',{class:'hour-label'},[txt(fmtTime(pad(h)+":00"))]));
      row.appendChild(el('div',{
        class:'hour-slot',
        onclick:()=>openModal(null, state.selectedDay, pad(h)+":00")
      }));
      grid.appendChild(row);
    }

    const now = new Date();
    if(sameDay(now, state.selectedDay) && now.getHours()>=startHour && now.getHours()<=endHour){
      const minsFromStart = (now.getHours()-startHour)*60+now.getMinutes();
      const top = (minsFromStart/60)*rowHeight;
      const nowLine = el('div',{class:'now-line', style:'top:'+top+'px;'});
      nowLine.appendChild(el('span',{class:'now-label'},[
        txt(fmtTime(pad(now.getHours())+":"+pad(now.getMinutes())))
      ]));
      grid.appendChild(nowLine);
    }

    // Teams/Outlook-style event layout. Events use the full available
    // calendar column; overlapping events share that column in lanes.
    const timed = dayEvents.filter(ev=>ev.start).map(ev=>{
      const start = timeToMinutes(ev.start);
      const end = ev.end ? Math.max(timeToMinutes(ev.end), start+30) : start+60;
      return {ev,start,end};
    }).sort((a,b)=>a.start-b.start || b.end-a.end);

    const groups = [];
    timed.forEach(item=>{
      let group = groups.find(g => item.start < g.end);
      if(group){
        group.items.push(item);
        group.end = Math.max(group.end, item.end);
      }else{
        groups.push({items:[item], end:item.end});
      }
    });

    timed.forEach(item=>{
      const group = groups.find(g=>g.items.includes(item));
      const lanes = Math.max(1, group ? group.items.length : 1);
      const lane = group ? group.items.indexOf(item) : 0;

      const top = ((item.start-startHour*60)/60)*rowHeight + 4;
      const height = Math.max(((item.end-item.start)/60)*rowHeight - 8, 42);

      // Keep all events inside the large calendar content area.
      const contentLeft = 98;
      const contentRight = 10;
      const contentWidth = `calc(100% - ${contentLeft + contentRight}px)`;
      const leftCalc = `calc(${contentLeft}px + (${contentWidth}) * ${lane}/${lanes})`;
      const widthCalc = `calc((${contentWidth})/${lanes} - 8px)`;

      const block = el('div',{
        class:'day-event cat-'+CATS[item.ev.category].cls,
        style:`top:${top}px;height:${height}px;left:${leftCalc};width:${widthCalc};animation-delay:${Math.min(lane*0.07,0.28)}s;`,
        title:item.ev.title,
        onclick:(e)=>{ e.stopPropagation(); openModal(item.ev); }
      },[
        el('div',{class:'name'},[txt(item.ev.title)]),
        el('div',{class:'time'},[
          txt(fmtTime(item.ev.start)+(item.ev.end ? " – "+fmtTime(item.ev.end) : ""))
        ])
      ]);
      grid.appendChild(block);
    });

    wrap.appendChild(grid);

    if(dayEvents.length===0){
      wrap.appendChild(el('div',{class:'empty-state'},[
        el('div',{class:'big'},[txt('Nothing scheduled')]),
        el('div',{},[txt('Click a time slot to add an event')])
      ]));
    }
    return wrap;
  }

  /* ---------------- Modal ---------------- */

  function openModal(ev, defaultDate, defaultStart){
    state.editing = ev ? {...ev} : {
      id: uid(),
      title:"",
      date: defaultDate ? dateKey(defaultDate) : dateKey(state.selectedDay),
      start: defaultStart || "09:00",
      end: defaultStart ? addMinutes(defaultStart,60) : "10:00",
      category:"work",
      notes:""
    };
    state.modalOpen = true;
    state.modalError = null;
    render();
  }
  function addMinutes(t, mins){
    const [h,m] = t.split(":").map(Number);
    const total = h*60+m+mins;
    const nh = Math.floor((total%1440)/60), nm = total%60;
    return pad(nh)+":"+pad(nm);
  }
  function closeModal(){
    state.modalOpen = false;
    state.editing = null;
    clearOverlay();
    render();
  }

  function renderModal(){
    const overlay = el('div',{class:'overlay', onclick:(e)=>{ if(e.target===overlay) closeModal(); }});
    const isNew = !state.events.find(e=>e.id===state.editing.id);
    const m = el('div',{class:'modal'});
    m.appendChild(el('h3',{},[txt(isNew? 'New event' : 'Edit event')]));

    const titleField = el('div',{class:'field'},[
      el('label',{},[txt('Title')]),
      el('input',{type:'text', id:'f-title', value: state.editing.title, placeholder:'e.g. Design review'})
    ]);
    m.appendChild(titleField);

    m.appendChild(el('div',{class:'field'},[
      el('label',{},[txt('Date')]),
      el('input',{type:'date', id:'f-date', value: state.editing.date})
    ]));

    m.appendChild(el('div',{class:'row2'},[
      el('div',{class:'field'},[
        el('label',{},[txt('Starts')]),
        el('input',{type:'time', id:'f-start', value: state.editing.start})
      ]),
      el('div',{class:'field'},[
        el('label',{},[txt('Ends')]),
        el('input',{type:'time', id:'f-end', value: state.editing.end})
      ]),
    ]));

    if(state.modalError){
      m.appendChild(el('div',{class:'err'},[txt(state.modalError)]));
    }

    const catField = el('div',{class:'field'},[el('label',{},[txt('Category')])]);
    const picker = el('div',{class:'cat-picker'});
    Object.keys(CATS).forEach(k=>{
      const opt = el('div',{
        class:'cat-opt'+(state.editing.category===k?' selected':''),
        onclick:()=>{ state.editing.category=k; render(); }
      },[
        el('span',{class:'sw swatch-'+CATS[k].cls}),
        txt(CATS[k].label)
      ]);
      picker.appendChild(opt);
    });
    catField.appendChild(picker);
    m.appendChild(catField);

    m.appendChild(el('div',{class:'field'},[
      el('label',{},[txt('Notes')]),
      el('textarea',{id:'f-notes', placeholder:'Optional details…'},[txt(state.editing.notes||"")])
    ]));

    const actions = el('div',{class:'modal-actions'});
    const leftActions = el('div',{},[]);
    if(!isNew){
      leftActions.appendChild(el('button',{class:'btn btn-danger', onclick:async()=>{
        if(!confirm('Delete this event? This cannot be undone.')) return;
        const btn = document.querySelector('.modal .btn-danger');
        if(btn){ btn.disabled=true; btn.textContent='Deleting…'; btn.style.opacity='.65'; btn.style.cursor='wait'; }
        const deleted = await deleteEvent(state.editing.id);
        if(deleted){
          state.modalOpen=false;
          state.editing=null;
          clearOverlay();
          showToast("Event deleted");
        }else{
          render();
        }
      }},[txt('Delete')]));
    }
    const rightActions = el('div',{style:'display:flex; gap:8px;'},[
      el('button',{class:'btn btn-ghost', type:'button', onclick:(e)=>{ e.preventDefault(); e.stopPropagation(); closeModal(); }},[txt('Cancel')]),
      el('button',{class:'btn btn-primary', type:'button', onclick: async(e)=>{ e.preventDefault(); await saveFromModal(); }},[txt('Save')]),
    ]);
    actions.appendChild(leftActions);
    actions.appendChild(rightActions);
    m.appendChild(actions);

    overlay.appendChild(m);

    setTimeout(()=> document.getElementById('f-title')?.focus(), 0);
    m.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

    return overlay;
  }

  async function saveFromModal(){
    const titleEl = document.getElementById('f-title');
    const dateEl = document.getElementById('f-date');
    const startEl = document.getElementById('f-start');
    const endEl = document.getElementById('f-end');
    const notesEl = document.getElementById('f-notes');

    const title = titleEl?.value.trim() || "";
    const date = dateEl?.value || "";
    const startTime = startEl?.value || "";
    const endTime = endEl?.value || "";
    const notes = notesEl?.value || "";

    if(!title){
      state.modalError = "Give this event a title.";
      render();
      setTimeout(()=>document.getElementById('f-title')?.focus(),0);
      return;
    }
    if(!date){
      state.modalError = "Pick a date.";
      render();
      return;
    }
    if(startTime && endTime && timeToMinutes(endTime) <= timeToMinutes(startTime)){
      state.modalError = "End time should be after the start time.";
      render();
      return;
    }

    const ev = { ...state.editing, title, date, start:startTime, end:endTime, notes };

    const saveBtn = document.querySelector('.modal .btn-primary');
    if(saveBtn){
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving…";
      saveBtn.style.opacity = ".65";
      saveBtn.style.cursor = "wait";
    }

    const saved = await upsertEvent(ev);

    if(!saved){
      render();
      return;
    }

    state.selectedDay = parseKey(date);
    state.cursor = new Date(state.selectedDay.getFullYear(), state.selectedDay.getMonth(), 1);
    state.modalOpen = false;
    state.editing = null;
    clearOverlay();
    showToast("Event saved");
  }


  // Firebase authentication controls access to the calendar.
  // Complete a Google redirect sign-in when the browser returns to this page.
  (async()=>{
    try{
      await getRedirectResult(auth);
    }catch(err){
      console.error("Google redirect sign-in failed:", err);
      state.authBusy=false;
      state.authError=friendlyAuthError(err);
      render();
    }
  })();

  window.addEventListener('error',(event)=>{
    console.error('Calendar runtime error:',event.error || event.message);
    if(!auth.currentUser && state){
      state.authBusy=false;
      state.authError='The login script encountered an error. Please refresh the page and try again.';
      render();
    }
  });

  window.addEventListener('unhandledrejection',(event)=>{
    console.error('Calendar unhandled promise rejection:',event.reason);
    if(!auth.currentUser && state){
      state.authBusy=false;
      state.authError=friendlyAuthError(event.reason);
      render();
    }
  });

  onAuthStateChanged(auth, async (user)=>{
    state.modalOpen = false;
    state.editing = null;
    state.authError = null;
    state.authBusy = false;
    if(user){
      state.loaded = false;
      render();
      await loadEvents();
    }else{
      state.events = [];
      state.loaded = false;
      render();
    }
  });

  // live-update the now-line every minute
  setInterval(()=>{ if(state.view==='day' && !state.modalOpen) render(); }, 60000);

})();
</script>
