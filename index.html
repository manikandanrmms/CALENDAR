<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Almanac — Calendar &amp; Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Serif+JP:wght@400;500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eeeae2;--paper:rgba(255,255,255,.62);--paper2:rgba(255,255,255,.78);--ink:#20211f;--muted:#73736d;--line:rgba(30,31,28,.10);--indigo:#3d496b;--sage:#778a76;--accent:#c77d52;--radius:22px;--shadow:0 18px 45px rgba(37,38,34,.12)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0%,rgba(213,197,178,.42),transparent 34%),linear-gradient(135deg,#f4f1eb,#e8e4dc);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;padding:18px;position:relative}.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(rgba(50,45,38,.18) .55px,transparent .55px);background-size:5px 5px;mix-blend-mode:multiply}
.topbar{height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;margin-bottom:16px;background:rgba(255,255,255,.52);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.7);border-radius:20px;box-shadow:0 8px 28px rgba(40,40,35,.07);position:sticky;top:14px;z-index:30}.brand{display:flex;align-items:center;gap:10px;min-width:150px}.brand .mark{width:32px;height:32px;border-radius:11px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-family:Georgia,serif}.brand h1{font:600 18px Georgia,serif;margin:0}.brand .sub{font-size:8px;letter-spacing:.16em;color:var(--muted);margin-top:2px}.topbar .spacer{flex:1}.view-toggle{display:flex;padding:3px;background:rgba(30,31,28,.06);border-radius:12px}.view-toggle button,.today-btn,.icon-btn{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px}.view-toggle button.active,.today-btn:hover,.icon-btn:hover{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 3px 12px rgba(0,0,0,.07)}.today-btn{border:1px solid var(--line);font-size:12px}.command{width:min(340px,28vw);height:38px;border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:12px;padding:0 13px;outline:none}.command:focus{background:#fff;box-shadow:0 0 0 3px rgba(61,73,107,.10)}
.workspace{display:grid;grid-template-columns:1fr 310px;gap:16px;max-width:1500px;margin:auto}.calendar-plane{background:rgba(255,255,255,.48);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.72);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;transform:perspective(1400px) rotateX(.5deg)}.calendar-head{display:flex;align-items:center;padding:24px 28px 18px;gap:16px}.month-title{font:500 clamp(28px,3vw,42px) Georgia,serif;letter-spacing:-.035em}.month-jp{font-family:'Noto Serif JP',serif;color:var(--muted);font-size:12px;margin-left:7px}.calendar-head .spacer{flex:1}.nav{display:flex;gap:4px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);margin:0 18px 18px;border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:16px;overflow:hidden}.month-dow{padding:10px 12px;font-size:9px;letter-spacing:.13em;color:var(--muted);background:rgba(255,255,255,.35);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.month-cell{min-height:118px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,.28);position:relative;transition:.25s;cursor:pointer}.month-cell:hover{background:rgba(255,255,255,.68);transform:translateZ(2px)}.month-cell.other-month{opacity:.38}.date-num{font-size:12px;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;margin-bottom:5px}.date-num.today{background:var(--indigo);color:#fff;box-shadow:0 5px 15px rgba(61,73,107,.24)}.cell-events{display:flex;flex-direction:column;gap:4px}.chip{font-size:10px;padding:5px 7px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(61,73,107,.10);color:#39425d;border-left:3px solid var(--indigo)}.chip.personal{background:rgba(119,138,118,.13);color:#526351;border-left-color:var(--sage)}.chip.focus{background:rgba(199,125,82,.13);color:#8b5538;border-left-color:var(--accent)}.chip .t{font-size:8px;opacity:.7;margin-right:4px}.chip-more{font-size:9px;color:var(--muted);padding:4px}
.side{display:flex;flex-direction:column;gap:14px}.glass-card{background:rgba(255,255,255,.56);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.78);border-radius:22px;box-shadow:0 14px 35px rgba(40,40,35,.09);padding:18px}.day-card{min-height:280px}.eyebrow{font-size:9px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}.day-number{font:500 46px Georgia,serif;margin:4px 0}.day-meta{color:var(--muted);font-size:12px}.event-card{margin-top:12px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.72);box-shadow:0 7px 20px rgba(30,30,25,.07);border:1px solid rgba(255,255,255,.75)}.event-time{font-size:9px;color:var(--muted);letter-spacing:.06em}.event-title{font-size:12px;margin-top:3px}.empty{color:var(--muted);font-size:12px;padding:22px 0}.new-btn{width:100%;border:0;background:var(--ink);color:#fff;border-radius:13px;padding:12px;font-weight:600}.mini{margin-top:18px}.mini-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:10px}.mini-nav{display:flex}.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:9px;text-align:center}.mini-grid span{padding:4px}.legend-row{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted);margin-top:9px}.legend-swatch{width:7px;height:7px;border-radius:50%;background:var(--indigo)}.swatch-personal{background:var(--sage)}.swatch-focus{background:var(--accent)}.swatch-other{background:#aaa}.user-area{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:auto}.logout-btn{border:0;background:transparent;color:var(--muted);font-size:10px}
.drawer{position:fixed;right:18px;top:96px;bottom:18px;width:min(390px,calc(100vw - 36px));z-index:50;background:rgba(248,247,243,.82);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.85);border-radius:26px;box-shadow:0 28px 70px rgba(20,20,18,.20);padding:22px;transform:translateX(110%);transition:.42s cubic-bezier(.2,.8,.2,1)}.drawer.open{transform:none}.drawer-close{float:right;border:0;background:rgba(0,0,0,.05);border-radius:50%;width:30px;height:30px}.drawer h2{font:500 30px Georgia,serif;margin:28px 0 4px}.overlay{position:fixed;inset:0;background:rgba(20,20,18,.15);z-index:40;opacity:0;pointer-events:none;transition:.3s}.overlay.open{opacity:1;pointer-events:auto}.modal{background:#faf9f5!important;border-radius:22px!important;box-shadow:0 30px 80px rgba(0,0,0,.22)!important}.auth-screen{background:radial-gradient(circle at 70% 20%,#ddd4c5,transparent 35%),#eeebe4!important}.auth-card{background:rgba(255,255,255,.65)!important;backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.8)!important;border-radius:28px!important;box-shadow:var(--shadow)!important}
@media(max-width:1050px){.workspace{grid-template-columns:1fr}.side{display:none}.command{width:220px}}@media(max-width:720px){.app{padding:8px}.topbar{padding:0 10px;gap:7px}.brand{min-width:auto}.brand .sub{display:none}.command{display:none}.view-toggle button{padding:7px}.calendar-head{padding:18px 14px}.calendar-grid{margin:0 8px 8px}.month-cell{min-height:86px;padding:6px}.chip{font-size:9px}.month-title{font-size:26px}}

.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:start;gap:16px}.app>.main{grid-column:1;min-width:0}.app>.sidebar{grid-column:2;grid-row:1;padding:12px 0 0}.canvas{background:rgba(255,255,255,.48);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.72);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;padding:6px}.main{min-width:0}.topbar-left{display:flex;align-items:center;gap:8px}.topbar-left h2{font:500 17px Georgia,serif;margin:0}.topbar-nav{display:flex}.topbar-command{display:flex;align-items:center;gap:8px;margin-left:auto}.command-wrap{display:flex;align-items:center;gap:8px}.command-hint{font-size:8px;color:var(--muted);letter-spacing:.08em}.sidebar .brand{margin:4px 8px 14px}.sidebar .new-btn{margin-bottom:0}.sidebar .mini,.sidebar .legend,.sidebar .upcoming{padding:0 4px}.sidebar .user-area{margin-top:12px;padding:0 6px}.sidebar .mini-grid button{border:0;background:transparent}.quick-add{position:absolute;right:7px;top:7px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(61,73,107,.08);color:var(--indigo);opacity:0;transition:.2s}.month-cell:hover .quick-add{opacity:1}.drag-over{background:rgba(61,73,107,.12)!important;box-shadow:inset 0 0 0 2px rgba(61,73,107,.25)}
@media(max-width:1050px){.app{display:block}.app>.sidebar{display:none}.topbar{top:8px}.workspace{display:block}}
</style>
</head>
<body>

<div class="app" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut,
  sendPasswordResetEmail, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  initializeFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCG1VUXp4U1_lIeGHqAAIC2Zo6bZYZJUzY",
  authDomain: "calendar-app-cf088.firebaseapp.com",
  projectId: "calendar-app-cf088",
  storageBucket: "calendar-app-cf088.firebasestorage.app",
  messagingSenderId: "900092970911",
  appId: "1:900092970911:web:1edd0c8eca1acd7efd1faa"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
setPersistence(auth, browserLocalPersistence).catch((error)=>{
  console.warn('Firebase Auth persistence could not be enabled; continuing with session auth:', error);
});
const db = initializeFirestore(firebaseApp, {
  experimentalForceLongPolling: true
});
const googleProvider = new GoogleAuthProvider();

(function(){
  "use strict";

  const CATS = {
    work:    { label:"Work",     cls:"work" },
    personal:{ label:"Personal", cls:"personal" },
    focus:   { label:"Focus",    cls:"focus" },
    other:   { label:"Other",    cls:"other" },
  };

  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function uid(){ return "ev_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function fmtTime(t){
    if(!t) return "";
    let [h,m] = t.split(":").map(Number);
    const ap = h>=12 ? "PM":"AM";
    h = h%12; if(h===0) h=12;
    return h+":"+pad(m)+ap;
  }
  function timeToMinutes(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }

  const state = {
    events: [],           // {id, title, date:"YYYY-MM-DD", start:"HH:MM", end:"HH:MM", category, notes}
    view: "month",        // "month" | "day"
    motion:"none",           // "next" | "prev" | "today" | "none"
    cursor: new Date(),   // month being viewed / selected day
    selectedDay: new Date(),
    loaded:false,
    editing:null,         // event being edited, or null for new
    modalOpen:false,
    modalDefaults:null,
    authMode:"login",
    authError:null,
    authBusy:false,
    authInitializing:true,
    toast:"",
    toastTimer:null,
    drawerOpen:false,
    dragEventId:null,
  };

  function eventsCollection(){
    if(!auth.currentUser) throw new Error("You must be signed in.");
    return collection(db, "users", auth.currentUser.uid, "events");
  }

  async function loadEvents(){
    if(!auth.currentUser) return;
    state.loaded = false;
    try{
      const snapshot = await getDocs(eventsCollection());
      state.events = snapshot.docs.map(d=>({id:d.id, ...d.data()}));
    }catch(e){
      console.error("Could not load events:", e);
      state.events = [];
      state.modalError = "Firestore could not connect. Please check your Internet/VPN/firewall and try again.";
    }
    state.loaded = true;
    render();
  }

  async function upsertEvent(ev){
    if(!auth.currentUser){
      state.modalError = "Please sign in before saving an event.";
      return false;
    }
    try{
      if(ev.id && state.events.some(e=>e.id===ev.id)){
        const eventRef = doc(db, "users", auth.currentUser.uid, "events", ev.id);
        const {id, ...data} = ev;
        await updateDoc(eventRef, {...data, updatedAt:serverTimestamp()});
        const idx = state.events.findIndex(e=>e.id===ev.id);
        if(idx>=0) state.events[idx] = ev;
      }else{
        const {id, ...data} = ev;
        const ref = await addDoc(eventsCollection(), {
          ...data,
          createdAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        });
        ev.id = ref.id;
        state.events.push(ev);
      }
      state.modalError = null;
      return true;
    }catch(e){
      console.error("Could not save event:", e);
      state.modalError = e?.code === "unavailable"
        ? "Firestore is temporarily unreachable. Please check your Internet/VPN/firewall and try again."
        : "Could not save this event. Check Firestore Security Rules.";
      return false;
    }
  }

  async function deleteEvent(id){
    if(!auth.currentUser){
      state.modalError = "Please sign in before deleting an event.";
      return false;
    }
    try{
      await deleteDoc(doc(db, "users", auth.currentUser.uid, "events", id));
      state.events = state.events.filter(e=>e.id!==id);
      state.modalError = null;
      return true;
    }catch(e){
      console.error("Could not delete event:", e);
      state.modalError = e?.code === "unavailable"
        ? "Firestore is temporarily unreachable. Please try again."
        : "Could not delete this event. Check Firestore Security Rules.";
      return false;
    }
  }

  function eventsOn(key){
    return state.events.filter(e=>e.date===key).sort((a,b)=> (a.start||"").localeCompare(b.start||""));
  }

  /* ---------------- Rendering ---------------- */


  function clearOverlay(){
    document.querySelectorAll('.overlay').forEach(node=>node.remove());
  }

  function showToast(message){
    state.toast = message;
    if(state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(()=>{
      state.toast = "";
      state.toastTimer = null;
      render();
    }, 2200);
  }

  function render(){
    clearOverlay();
    const app = document.getElementById('app');
    app.innerHTML = "";
    if(!auth.currentUser){
      app.appendChild(renderAuth());
      return;
    }
    app.appendChild(renderSidebar());
    app.appendChild(renderMain());
    if(state.drawerOpen) app.appendChild(renderDayDrawer());
    if(state.modalOpen) app.appendChild(renderModal());
    if(state.toast){
      app.appendChild(el('div',{class:'app-toast'},[txt(state.toast)]));
    }
  }

  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if(children) children.forEach(c=> c && e.appendChild(c));
    return e;
  }
  function txt(t){ return document.createTextNode(t); }


  function friendlyAuthError(error){
    const code = error?.code || "";
    const messages = {
      "auth/invalid-credential":"Email or password is incorrect.",
      "auth/invalid-email":"Please enter a valid email address.",
      "auth/email-already-in-use":"An account already exists with this email.",
      "auth/weak-password":"Password should be at least 6 characters.",
      "auth/popup-closed-by-user":"Google sign-in was cancelled. Please try again.",
      "auth/cancelled-popup-request":"A Google sign-in window was already in progress. Close any Google sign-in window and click the button once.",
      "auth/popup-blocked":"Your browser blocked the Google sign-in window.",
      "auth/too-many-requests":"Too many attempts. Please try again later.",
      "auth/operation-not-allowed":"Email/password sign-in is not enabled in this Firebase project. Enable it under Firebase Console → Authentication → Sign-in method.",
      "auth/network-request-failed":"Firebase could not reach the authentication service. Check your Internet connection, VPN, firewall, or browser extensions.",
      "auth/invalid-api-key":"The Firebase API key is invalid. Check the Firebase configuration.",
      "auth/app-not-authorized":"This app origin is not authorized by Firebase. Add localhost to Firebase Authentication → Settings → Authorized domains.",
      "auth/unauthorized-domain":"This website is not authorized for Firebase Authentication. Add its domain under Firebase Authentication → Settings → Authorized domains.",
      "auth/user-disabled":"This account has been disabled in Firebase Authentication.",
      "auth/user-not-found":"No account exists for this email address.",
      "auth/wrong-password":"Email or password is incorrect."
    };
    return messages[code] || error?.message || "Authentication failed.";
  }

  function renderAuth(){
    const shell = el('div',{class:'auth-shell'});
    const card = el('div',{class:'auth-card'});
    const isLogin = state.authMode==="login";

    card.appendChild(el('div',{class:'auth-brand'},[
      el('div',{class:'mark'},[txt('A')]),
      el('div',{},[
        el('h1',{},[txt('Almanac')]),
        el('div',{class:'auth-sub'},[txt('CALENDAR · SCHEDULER')])
      ])
    ]));
    card.appendChild(el('h2',{class:'auth-title'},[txt(isLogin?'Welcome back':'Create your account')]));
    card.appendChild(el('p',{class:'auth-copy'},[txt(isLogin?'Sign in to access your cloud calendar.':'Create a secure account for your cloud calendar.')]));
    if(location.protocol==='file:') card.appendChild(el('div',{class:'auth-environment-note'},[
      el('strong',{},[txt('Local preview detected')]),
      txt(' Firebase Authentication works reliably when Almanac is opened from http://localhost rather than directly as a file. Use the included run-almanac.bat file to start it.')
    ]));

    if(state.authError) card.appendChild(el('div',{class:'auth-error'},[txt(state.authError)]));

    const email = el('input',{type:'email',id:'auth-email',placeholder:'you@example.com',autocomplete:'email'});
    const password = el('input',{type:'password',id:'auth-password',placeholder:'Password',autocomplete:isLogin?'current-password':'new-password'});
    card.appendChild(el('div',{class:'auth-field'},[el('label',{},[txt('Email')]),email]));
    card.appendChild(el('div',{class:'auth-field'},[el('label',{},[txt('Password')]),password]));

    const submitAuth = async()=>{
      if(state.authBusy) return;
      const emailValue=email.value.trim(), passwordValue=password.value;
      if(!emailValue || !passwordValue){state.authError="Enter your email and password.";render();return;}
      if(!/^\S+@\S+\.\S+$/.test(emailValue)){state.authError="Please enter a valid email address.";render();return;}
      state.authBusy=true;
      state.authError=null;
      render();
      try{
        // Do not block sign-in on browser storage/persistence.
        const request = isLogin
          ? signInWithEmailAndPassword(auth,emailValue,passwordValue)
          : createUserWithEmailAndPassword(auth,emailValue,passwordValue);
        await Promise.race([
          request,
          new Promise((_,reject)=>setTimeout(()=>reject(Object.assign(new Error('Firebase authentication timed out.'),{code:'auth/network-request-failed'})),20000))
        ]);
      }catch(err){
        console.error('Firebase authentication failed:', err);
        state.authBusy=false;
        state.authError=friendlyAuthError(err);
        render();
      }
    };

    card.appendChild(el('button',{class:'auth-primary',disabled:state.authBusy,style:state.authBusy?'opacity:.65;cursor:wait;':'',onclick:submitAuth},[txt(state.authBusy?(isLogin?'Signing in…':'Creating account…'):(isLogin?'Sign in':'Create account'))]));

    if(isLogin){
      card.appendChild(el('button',{class:'auth-link',type:'button',style:'margin:10px auto 2px;display:block;background:none;border:0;cursor:pointer;font:inherit;',disabled:state.authBusy,onclick:async()=>{
        const emailValue=email.value.trim();
        if(!/^\S+@\S+\.\S+$/.test(emailValue)){state.authError='Enter your email first, then choose Forgot password.';render();return;}
        try{
          state.authBusy=true; state.authError=null; render();
          await sendPasswordResetEmail(auth,emailValue);
          state.authBusy=false; state.authError='Password reset email sent. Check your inbox.'; render();
        }catch(err){
          console.error('Password reset failed:',err);
          state.authBusy=false; state.authError=friendlyAuthError(err); render();
        }
      }},[txt('Forgot password?')]));
    }

    card.appendChild(el('div',{class:'auth-divider'},[txt('OR')]));
    card.appendChild(el('button',{
      class:'auth-google',
      disabled:state.authBusy,
      style:state.authBusy?'opacity:.6;cursor:wait;':'',
      onclick:async()=>{
        if(state.authBusy) return;

        // OAuth popups need a real web origin. Opening the downloaded HTML
        // directly with file:// can cause Firebase to cancel the popup flow.
        if(location.protocol === 'file:'){
          state.authError = "Google sign-in needs the app to run from http://localhost or a hosted HTTPS address. Email/password sign-in can still be tested here.";
          render();
          return;
        }

        try{
          state.authBusy=true;
          state.authError=null;
          render();
          await signInWithPopup(auth,googleProvider);
        }catch(err){
          console.error(err);
          state.authBusy=false;
          state.authError=friendlyAuthError(err);
          render();
        }
      }
    },[txt(state.authBusy?'Opening Google…':'Continue with Google')]));

    card.appendChild(el('div',{class:'auth-switch'},[
      txt(isLogin?"Don't have an account? ":"Already have an account? "),
      el('button',{class:'auth-link',onclick:()=>{
        state.authMode=isLogin?'register':'login';
        state.authError=null;
        render();
      }},[txt(isLogin?'Create one':'Sign in')])
    ]));
    return shell.appendChild(card), shell;
  }

  function renderSidebar(){
    const sb = el('div',{class:'sidebar'});

    // brand
    sb.appendChild(el('div',{class:'brand'},[

  function parseNaturalCommand(input){
    const raw=input.trim();
    if(!raw) return null;
    const lower=raw.toLowerCase();
    const now=new Date();
    let d=new Date(now); d.setHours(0,0,0,0);
    if(/\btomorrow\b/.test(lower)) d.setDate(d.getDate()+1);
    else if(/\byesterday\b/.test(lower)) d.setDate(d.getDate()-1);
    else if(/\btoday\b/.test(lower)){}
    else{
      const weekdays={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
      const hit=Object.keys(weekdays).find(w=>new RegExp('\b'+w+'\b').test(lower));
      if(hit){ const delta=(weekdays[hit]-d.getDay()+7)%7; d.setDate(d.getDate()+(delta||7)); }
      else{
        const dateMatch=lower.match(/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/);
        if(dateMatch){ const yy=dateMatch[3]?Number(dateMatch[3].length===2?'20'+dateMatch[3]:dateMatch[3]):d.getFullYear(); d=new Date(yy,Number(dateMatch[2])-1,Number(dateMatch[1])); }
      }
    }
    let start='09:00';
    const timeMatch=lower.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
    if(timeMatch){ let h=Number(timeMatch[1]); const min=Number(timeMatch[2]||0); const ap=timeMatch[3]; if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;start=pad(h)+':'+pad(min); }
    const title=raw
      .replace(/\b(today|tomorrow|yesterday|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/ig,'')
      .replace(/\b\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?\b/g,'')
      .replace(/\b\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/ig,'')
      .replace(/^\s*(at|on|for)\s+/i,'').replace(/\s+/g,' ').trim();
    return {date:d,title:title||'New event',start};
  }

  function renderDayView(){
    const wrap = el('div',{class:'day-view'});
    const key = dateKey(state.selectedDay);
    const dayEvents = eventsOn(key);

    const grid = el('div',{class:'day-grid'});
    const startHour = 6, endHour = 23;
    const rowHeight = 56;
    const labelWidth = 76;

    for(let h=startHour; h<=endHour; h++){
      const row = el('div',{class:'hour-row'});
      row.appendChild(el('div',{class:'hour-label'},[txt(fmtTime(pad(h)+":00"))]));
      row.appendChild(el('div',{
        class:'hour-slot',
        onclick:()=>openModal(null, state.selectedDay, pad(h)+":00")
      }));
      grid.appendChild(row);
    }

    const now = new Date();
    if(sameDay(now, state.selectedDay) && now.getHours()>=startHour && now.getHours()<=endHour){
      const minsFromStart = (now.getHours()-startHour)*60+now.getMinutes();
      const top = (minsFromStart/60)*rowHeight;
      const nowLine = el('div',{class:'now-line', style:'top:'+top+'px;'});
      nowLine.appendChild(el('span',{class:'now-label'},[
        txt(fmtTime(pad(now.getHours())+":"+pad(now.getMinutes())))
      ]));
      grid.appendChild(nowLine);
    }

    // Teams/Outlook-style event layout. Events use the full available
    // calendar column; overlapping events share that column in lanes.
    const timed = dayEvents.filter(ev=>ev.start).map(ev=>{
      const start = timeToMinutes(ev.start);
      const end = ev.end ? Math.max(timeToMinutes(ev.end), start+30) : start+60;
      return {ev,start,end};
    }).sort((a,b)=>a.start-b.start || b.end-a.end);

    const groups = [];
    timed.forEach(item=>{
      let group = groups.find(g => item.start < g.end);
      if(group){
        group.items.push(item);
        group.end = Math.max(group.end, item.end);
      }else{
        groups.push({items:[item], end:item.end});
      }
    });

    timed.forEach(item=>{
      const group = groups.find(g=>g.items.includes(item));
      const lanes = Math.max(1, group ? group.items.length : 1);
      const lane = group ? group.items.indexOf(item) : 0;

      const top = ((item.start-startHour*60)/60)*rowHeight + 4;
      const height = Math.max(((item.end-item.start)/60)*rowHeight - 8, 42);

      // Keep all events inside the large calendar content area.
      const contentLeft = 98;
      const contentRight = 10;
      const contentWidth = `calc(100% - ${contentLeft + contentRight}px)`;
      const leftCalc = `calc(${contentLeft}px + (${contentWidth}) * ${lane}/${lanes})`;
      const widthCalc = `calc((${contentWidth})/${lanes} - 8px)`;

      const block = el('div',{
        class:'day-event cat-'+CATS[item.ev.category].cls,
        style:`top:${top}px;height:${height}px;left:${leftCalc};width:${widthCalc};animation-delay:${Math.min(lane*0.07,0.28)}s;`,
        title:item.ev.title,
        onclick:(e)=>{ e.stopPropagation(); openModal(item.ev); }
      },[
        el('div',{class:'name'},[txt(item.ev.title)]),
        el('div',{class:'time'},[
          txt(fmtTime(item.ev.start)+(item.ev.end ? " – "+fmtTime(item.ev.end) : ""))
        ])
      ]);
      grid.appendChild(block);
    });

    wrap.appendChild(grid);

    if(dayEvents.length===0){
      wrap.appendChild(el('div',{class:'empty-state'},[
        el('div',{class:'big'},[txt('Nothing scheduled')]),
        el('div',{},[txt('Click a time slot to add an event')])
      ]));
    }
    return wrap;
  }

  function openModal(ev, defaultDate, defaultStart){
    state.editing = ev ? {...ev} : {
      id: uid(),
      title:"",
      date: defaultDate ? dateKey(defaultDate) : dateKey(state.selectedDay),
      start: defaultStart || "09:00",
      end: defaultStart ? addMinutes(defaultStart,60) : "10:00",
      category:"work",
      notes:""
    };
    state.modalOpen = true;
    state.modalError = null;
    render();
  }
  function addMinutes(t, mins){
    const [h,m] = t.split(":").map(Number);
    const total = h*60+m+mins;
    const nh = Math.floor((total%1440)/60), nm = total%60;
    return pad(nh)+":"+pad(nm);
  }
  function closeModal(){
    state.modalOpen = false;
    state.editing = null;
    clearOverlay();
    render();
  }

  function renderModal(){
    const overlay = el('div',{class:'overlay', onclick:(e)=>{ if(e.target===overlay) closeModal(); }});
    const isNew = !state.events.find(e=>e.id===state.editing.id);
    const m = el('div',{class:'modal'});
    m.appendChild(el('h3',{},[txt(isNew? 'New event' : 'Edit event')]));

    const titleField = el('div',{class:'field'},[
      el('label',{},[txt('Title')]),
      el('input',{type:'text', id:'f-title', value: state.editing.title, placeholder:'e.g. Design review'})
    ]);
    m.appendChild(titleField);

    m.appendChild(el('div',{class:'field'},[
      el('label',{},[txt('Date')]),
      el('input',{type:'date', id:'f-date', value: state.editing.date})
    ]));

    m.appendChild(el('div',{class:'row2'},[
      el('div',{class:'field'},[
        el('label',{},[txt('Starts')]),
        el('input',{type:'time', id:'f-start', value: state.editing.start})
      ]),
      el('div',{class:'field'},[
        el('label',{},[txt('Ends')]),
        el('input',{type:'time', id:'f-end', value: state.editing.end})
      ]),
    ]));

    if(state.modalError){
      m.appendChild(el('div',{class:'err'},[txt(state.modalError)]));
    }

    const catField = el('div',{class:'field'},[el('label',{},[txt('Category')])]);
    const picker = el('div',{class:'cat-picker'});
    Object.keys(CATS).forEach(k=>{
      const opt = el('div',{
        class:'cat-opt'+(state.editing.category===k?' selected':''),
        onclick:()=>{ state.editing.category=k; render(); }
      },[
        el('span',{class:'sw swatch-'+CATS[k].cls}),
        txt(CATS[k].label)
      ]);
      picker.appendChild(opt);
    });
    catField.appendChild(picker);
    m.appendChild(catField);

    m.appendChild(el('div',{class:'field'},[
      el('label',{},[txt('Notes')]),
      el('textarea',{id:'f-notes', placeholder:'Optional details…'},[txt(state.editing.notes||"")])
    ]));

    const actions = el('div',{class:'modal-actions'});
    const leftActions = el('div',{},[]);
    if(!isNew){
      leftActions.appendChild(el('button',{class:'btn btn-danger', onclick:async()=>{
        if(!confirm('Delete this event? This cannot be undone.')) return;
        const btn = document.querySelector('.modal .btn-danger');
        if(btn){ btn.disabled=true; btn.textContent='Deleting…'; btn.style.opacity='.65'; btn.style.cursor='wait'; }
        const deleted = await deleteEvent(state.editing.id);
        if(deleted){
          state.modalOpen=false;
          state.editing=null;
          clearOverlay();
          showToast("Event deleted");
        }else{
          render();
        }
      }},[txt('Delete')]));
    }
    const rightActions = el('div',{style:'display:flex; gap:8px;'},[
      el('button',{class:'btn btn-ghost', type:'button', onclick:(e)=>{ e.preventDefault(); e.stopPropagation(); closeModal(); }},[txt('Cancel')]),
      el('button',{class:'btn btn-primary', type:'button', onclick: async(e)=>{ e.preventDefault(); await saveFromModal(); }},[txt('Save')]),
    ]);
    actions.appendChild(leftActions);
    actions.appendChild(rightActions);
    m.appendChild(actions);

    overlay.appendChild(m);

    setTimeout(()=> document.getElementById('f-title')?.focus(), 0);
    m.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

    return overlay;
  }

  async function saveFromModal(){
    const titleEl = document.getElementById('f-title');
    const dateEl = document.getElementById('f-date');
    const startEl = document.getElementById('f-start');
    const endEl = document.getElementById('f-end');
    const notesEl = document.getElementById('f-notes');

    const title = titleEl?.value.trim() || "";
    const date = dateEl?.value || "";
    const startTime = startEl?.value || "";
    const endTime = endEl?.value || "";
    const notes = notesEl?.value || "";

    if(!title){
      state.modalError = "Give this event a title.";
      render();
      setTimeout(()=>document.getElementById('f-title')?.focus(),0);
      return;
    }
    if(!date){
      state.modalError = "Pick a date.";
      render();
      return;
    }
    if(startTime && endTime && timeToMinutes(endTime) <= timeToMinutes(startTime)){
      state.modalError = "End time should be after the start time.";
      render();
      return;
    }

    const ev = { ...state.editing, title, date, start:startTime, end:endTime, notes };

    const saveBtn = document.querySelector('.modal .btn-primary');
    if(saveBtn){
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving…";
      saveBtn.style.opacity = ".65";
      saveBtn.style.cursor = "wait";
    }

    const saved = await upsertEvent(ev);

    if(!saved){
      render();
      return;
    }

    state.selectedDay = parseKey(date);
    state.cursor = new Date(state.selectedDay.getFullYear(), state.selectedDay.getMonth(), 1);
    state.modalOpen = false;
    state.editing = null;
    clearOverlay();
    showToast("Event saved");
  }


  // Firebase authentication controls access to the calendar.

  document.addEventListener('keydown',e=>{
    if(e.target && ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if(e.key.toLowerCase()==='n'){e.preventDefault();openModal(null,state.selectedDay);}
    else if(e.key.toLowerCase()==='t'){e.preventDefault();const t=new Date();state.cursor=new Date(t.getFullYear(),t.getMonth(),1);state.selectedDay=t;state.motion='today';render();}
    else if(e.key==='Escape' && state.drawerOpen){state.drawerOpen=false;render();}
  });

  onAuthStateChanged(auth, async (user)=>{
    state.modalOpen = false;
    state.editing = null;
    state.authError = null;
    state.authBusy = false;
    state.authInitializing = false;
    if(user){
      state.loaded = false;
      render();
      try{ await loadEvents(); }catch(err){
        console.error('Post-login calendar load failed:',err);
        state.toast = 'Signed in, but calendar data could not be loaded.';
      }
      render();
    }else{
      state.events = [];
      state.loaded = false;
      render();
    }
  });

  // live-update the now-line every minute
  setInterval(()=>{ if(state.view==='day' && !state.modalOpen) render(); }, 60000);

})();
</script>
</body>
</html>
