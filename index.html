} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCG1VUXp4U1_lIeGHqAAIC2Zo6bZYZJUzY",

(function(){

  const CATS = {

    other:   { label:"Other",    cls:"other" },
  };

  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function uid(){ return "ev_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function fmtTime(t){
    if(!t) return "";

    const ap = h>=12 ? "PM":"AM";

    return h+":"+pad(m)+ap;

  function timeToMinutes(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }

    toast:"",
    toastTimer:null,

    dragEventId:null,
  };

  function eventsCollection(){
    if(!auth.currentUser) throw new Error("You must be signed in.");
    return collection(db, "users", auth.currentUser.uid, "events");
  }

  async function loadEvents(){
    if(!auth.currentUser) return;
    state.loaded = false;
    try{
      const snapshot = await getDocs(eventsCollection());
      state.events = snapshot.docs.map(d=>({id:d.id, ...d.data()}));

    }catch(e){
      console.error("Could not save event:", e);
      state.modalError = e?.code === "unavailable"
        ? "Firestore is temporarily unreachable. Please check your Internet/VPN/firewall and try again."
        : "Could not save this event. Check Firestore Security Rules.";
      return false;
    }
  }

  async function deleteEvent(id){
    if(!auth.currentUser){
      state.modalError = "Please sign in before deleting an event.";
      return false;
    }
    try{
      await deleteDoc(doc(db, "users", auth.currentUser.uid, "events", id));
      state.events = state.events.filter(e=>e.id!==id);
      state.modalError = null;
      return true;
    }catch(e){
      console.error("Could not delete event:", e);
      state.modalError = e?.code === "unavailable"
        ? "Firestore is temporarily unreachable. Please try again."
        : "Could not delete this event. Check Firestore Security Rules.";
      return false;
    }
  }

    return state.events.filter(e=>e.date===key).sort((a,b)=> (a.start||"").localeCompare(b.start||""));

  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if(typeof attrs[k] === 'boolean') e[k] = attrs[k];
      else if(attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    if(children) children.forEach(c=> c && e.appendChild(c));
    return e;
  }

  function parseNaturalCommand(input){
    const raw=input.trim();
    if(!raw) return null;
    const lower=raw.toLowerCase();
    const now=new Date();
    let d=new Date(now); d.setHours(0,0,0,0);
    if(/\btomorrow\b/.test(lower)) d.setDate(d.getDate()+1);
    else if(/\byesterday\b/.test(lower)) d.setDate(d.getDate()-1);
    else if(/\btoday\b/.test(lower)){}
    else{
      const weekdays={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
      const hit=Object.keys(weekdays).find(w=>new RegExp('\b'+w+'\b').test(lower));
      if(hit){ const delta=(weekdays[hit]-d.getDay()+7)%7; d.setDate(d.getDate()+(delta||7)); }
      else{
        const dateMatch=lower.match(/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/);
        if(dateMatch){ const yy=dateMatch[3]?Number(dateMatch[3].length===2?'20'+dateMatch[3]:dateMatch[3]):d.getFullYear(); d=new Date(yy,Number(dateMatch[2])-1,Number(dateMatch[1])); }
      }
    }
    let start='09:00';
    const timeMatch=lower.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
    if(timeMatch){ let h=Number(timeMatch[1]); const min=Number(timeMatch[2]||0); const ap=timeMatch[3]; if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;start=pad(h)+':'+pad(min); }
    const title=raw
      .replace(/\b(today|tomorrow|yesterday|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/ig,'')
      .replace(/\b\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?\b/g,'')
      .replace(/\b\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/ig,'')
      .replace(/^\s*(at|on|for)\s+/i,'').replace(/\s+/g,' ').trim();
    return {date:d,title:title||'New event',start};
  }

  function step(dir){
    state.motion = dir > 0 ? 'next' : 'prev';

      state.selectedDay = d;
      state.cursor = new Date(d.getFullYear(), d.getMonth(),1);

  async function dropEventOnDate(date){
    const id=state.dragEventId;
    state.dragEventId=null;
    const ev=state.events.find(x=>x.id===id);
    if(!ev || ev.date===date) return;
    const moved={...ev,date};
    const ok=await upsertEvent(moved);
    if(ok){ showToast('Moved “'+ev.title+'” to '+parseKey(date).toLocaleDateString(undefined,{month:'short',day:'numeric'})); render(); }
  }


  function renderMonthGrid(){
    const wrap = el('div',{});
    const grid = el('div',{class:'month-grid'});
    DOW.forEach(d=> grid.appendChild(el('div',{class:'month-dow'},[txt(d)])));

    const y = state.cursor.getFullYear(), m = state.cursor.getMonth();
    const firstOfMonth = new Date(y,m,1);
    const startOffset = firstOfMonth.getDay();
    const gridStart = new Date(y,m,1-startOffset);
    const today = new Date();

    for(let i=0;i<42;i++){
      const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      const key = dateKey(d);
      const isOther = d.getMonth()!==m;
      const isToday = sameDay(d, today);
      const dayEvents = eventsOn(key);

      const cell = el('div',{
        class:'month-cell'+(isOther?' other-month':''),
        style:`animation-delay:${Math.min(i*0.018,0.48)}s`,
        onclick:()=>openDayDrawer(d),
        ondragover:(e)=>{e.preventDefault();cell.classList.add('drag-over');},
        ondragleave:()=>cell.classList.remove('drag-over'),
        ondrop:async(e)=>{e.preventDefault();cell.classList.remove('drag-over');await dropEventOnDate(dateKey(d));}
      });
      cell.appendChild(el('div',{class:'date-num'+(isToday?' today':'')},[txt(d.getDate())]));
      cell.appendChild(el('button',{class:'quick-add',title:'Add event',onclick:(e)=>{e.stopPropagation();openModal(null,d)}},[txt('+')]));

      const evWrap = el('div',{class:'cell-events'});
      const shown = dayEvents.slice(0,3);
      shown.forEach(ev=>{
        const chip = el('div',{class:'chip cat-'+CATS[ev.category].cls,draggable:'true',onclick:(e)=>{ e.stopPropagation(); openModal(ev); },ondragstart:(e)=>startEventDrag(e,ev.id),ondragend:()=>{document.querySelectorAll('.month-cell').forEach(c=>c.classList.remove('drag-over'));}},[]);
        if(ev.start) chip.appendChild(el('span',{class:'t'},[txt(fmtTime(ev.start).replace(':00',''))]));
        chip.appendChild(el('span',{},[txt(ev.title)]));
        evWrap.appendChild(chip);
      });
      if(dayEvents.length>3){
        evWrap.appendChild(el('div',{class:'chip-more'},[txt('+'+(dayEvents.length-3)+' more')]));
      }
      cell.appendChild(evWrap);
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    return wrap;
  }

  function renderDayView(){
    const wrap = el('div',{class:'day-view-pro'});
    const d = state.selectedDay;
    const key = dateKey(d);
    const dayEvents = eventsOn(key);
    const timed = dayEvents.filter(ev=>ev.start).map(ev=>{
      const start=timeToMinutes(ev.start);
      const end=ev.end ? Math.max(timeToMinutes(ev.end),start+30) : start+60;
      return {ev,start,end};
    }).sort((a,b)=>a.start-b.start || b.end-a.end);

    const summary = el('div',{class:'day-summary'},[
      el('div',{class:'day-summary-date'},[
        el('span',{class:'day-summary-num'},[txt(String(d.getDate()))]),
        el('div',{},[
          el('div',{class:'day-summary-week'},[txt(d.toLocaleDateString(undefined,{weekday:'long'}).toUpperCase())]),
          el('div',{class:'day-summary-month'},[txt(d.toLocaleDateString(undefined,{month:'long',year:'numeric'}))])
        ])
      ]),
      el('div',{class:'day-summary-stats'},[
        el('div',{},[el('b',{},[txt(String(dayEvents.length))]),txt(' events')]),
        el('div',{},[el('b',{},[txt(String(timed.length))]),txt(' timed')])
      ]),
      el('button',{class:'day-add-btn',onclick:()=>openModal(null,d,'09:00')},[txt('+ Add event')])
    ]);
    wrap.appendChild(summary);

    const scroller=el('div',{class:'day-scroll'});
    const grid=el('div',{class:'day-grid-pro'});
    const startHour=6,endHour=23,rowHeight=68;
    for(let h=startHour;h<=endHour;h++){
      const row=el('div',{class:'day-row-pro'});
      row.appendChild(el('div',{class:'day-time-pro'},[txt(fmtTime(pad(h)+':00'))]));
      const slot=el('div',{class:'day-slot-pro',onclick:()=>openModal(null,d,pad(h)+':00')});
      slot.appendChild(el('span',{class:'slot-hint'},[txt('Add') ]));
      row.appendChild(slot); grid.appendChild(row);
    }

    const now=new Date();
    if(sameDay(now,d) && now.getHours()>=startHour && now.getHours()<=endHour){
      const top=((now.getHours()-startHour)*60+now.getMinutes())/60*rowHeight;
      const line=el('div',{class:'day-now-pro',style:'top:'+top+'px'});
      line.appendChild(el('span',{class:'day-now-dot'}));
      line.appendChild(el('span',{class:'day-now-label'},[txt(fmtTime(pad(now.getHours())+':'+pad(now.getMinutes())))]));
      grid.appendChild(line);
    }

    // Compute overlapping lanes.
    const groups=[];
    timed.forEach(item=>{
      let g=groups.find(g=>item.start<g.end);
      if(!g){g={items:[],end:item.end};groups.push(g)}
      g.items.push(item); g.end=Math.max(g.end,item.end);
    });
    timed.forEach(item=>{
      const g=groups.find(x=>x.items.includes(item));
      const lanes=g.items.length; const lane=g.items.indexOf(item);
      const top=((item.start-startHour*60)/60)*rowHeight+5;
      const height=Math.max(((item.end-item.start)/60)*rowHeight-10,58);
      const left=`calc(96px + (100% - 110px) * ${lane}/${lanes} + 4px)`;
      const width=`calc((100% - 110px) / ${lanes} - 8px)`;
      const block=el('div',{class:'day-event-pro cat-'+CATS[item.ev.category].cls,style:`top:${top}px;left:${left};width:${width};min-height:${height}px;`,onclick:e=>{e.stopPropagation();openModal(item.ev)}},[
        el('div',{class:'day-event-time'},[txt(fmtTime(item.ev.start)+(item.ev.end?' – '+fmtTime(item.ev.end):''))]),
        el('div',{class:'day-event-name'},[txt(item.ev.title)]),
        item.ev.notes ? el('div',{class:'day-event-notes'},[txt(item.ev.notes)]) : el('div',{class:'day-event-cat'},[txt(CATS[item.ev.category].label)])
      ]);
      grid.appendChild(block);
    });
    scroller.appendChild(grid); wrap.appendChild(scroller);

    if(!dayEvents.length){
      wrap.appendChild(el('div',{class:'day-empty-pro'},[
        el('div',{class:'empty-icon'},[txt('＋')]),
        el('b',{},[txt('A quiet day')]),
        el('span',{},[txt('Click any time slot to add an event.')])
      ]));
    }
    return wrap;
  }


  function renderScheduleView(){
    const wrap=el('div',{class:'schedule-view'});
    const base=new Date(state.selectedDay); base.setHours(0,0,0,0);
    const start=new Date(base); start.setDate(start.getDate()-2);
    const days=[]; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); days.push(d); }
    const end=new Date(days[6]); end.setDate(end.getDate()+1);
    const range=days[0].toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+days[6].toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const toolbar=el('div',{class:'schedule-toolbar'},[
      el('div',{class:'schedule-range'},[
        el('strong',{},[txt('Schedule')]),el('span',{},[txt(range)])
      ]),
      el('div',{class:'schedule-tools'},[
        el('button',{class:'schedule-tool',onclick:()=>{state.selectedDay=new Date();state.cursor=new Date(state.selectedDay.getFullYear(),state.selectedDay.getMonth(),1);render();}},[txt('Today')]),
        el('button',{class:'schedule-tool',onclick:()=>openModal(null,state.selectedDay,'09:00')},[txt('+ Add event')])
      ])
    ]); wrap.appendChild(toolbar);
    const board=el('div',{class:'schedule-board'});
    const header=el('div',{class:'schedule-header'},[el('div',{class:'task-head'},[txt('EVENT / DETAILS')])]);
    days.forEach(d=>{ const today=sameDay(d,new Date()); header.appendChild(el('div',{class:'schedule-day'+(today?' today':'')},[
      el('b',{},[txt(d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase())]),
      el('span',{},[txt(d.toLocaleDateString(undefined,{month:'short',day:'numeric'}))])
    ])); }); board.appendChild(header);
    const events=state.events.filter(ev=>ev.date>=dateKey(days[0])&&ev.date<=dateKey(days[6])).sort((a,b)=>((a.date||'').localeCompare(b.date||'')) || ((a.start||'').localeCompare(b.start||'')));
    if(!events.length){ board.appendChild(el('div',{class:'schedule-empty'},[el('b',{},[txt('Nothing scheduled')]),el('span',{},[txt('Add an event to see it on the schedule.')])])); wrap.appendChild(board); return wrap; }
    events.forEach(ev=>{
      const row=el('div',{class:'schedule-row'});
      const cat=CATS[ev.category]?.cls||'other';
      row.appendChild(el('div',{class:'schedule-task'},[
        el('div',{class:'schedule-task-main'},[el('span',{class:'schedule-dot '+cat}),el('span',{class:'schedule-task-title'},[txt(ev.title||'Untitled')])]),
        el('div',{class:'schedule-task-meta'},[txt((ev.start?fmtTime(ev.start):'All day')+(ev.end?' · '+fmtTime(ev.end):''))])
      ]));
      days.forEach(d=>{
        const cell=el('div',{class:'schedule-day-cell'+(sameDay(d,new Date())?' today':'')});
        if(dateKey(d)===ev.date){
          cell.appendChild(el('div',{class:'schedule-event-bar '+cat,onclick:()=>openModal(ev)},[
            el('div',{class:'schedule-event-title'},[txt(ev.title||'Untitled')]),
            el('div',{class:'schedule-event-time'},[txt(ev.start?fmtTime(ev.start):'All day'+(ev.end?' – '+fmtTime(ev.end):''))])
          ]));
        }
        cell.addEventListener('dblclick',()=>openModal(null,d,'09:00'));
        row.appendChild(cell);
      });
      board.appendChild(row);
    });
    wrap.appendChild(board); return wrap;
  }

  /* ---------------- Modal ---------------- */

  function openModal(ev, defaultDate, defaultStart){
    state.editing = ev ? {...ev} : {
      id: uid(),
      title:"",
      date: defaultDate ? dateKey(defaultDate) : dateKey(state.selectedDay),
      start: defaultStart || "09:00",
      end: defaultStart ? addMinutes(defaultStart,60) : "10:00",
      category:"work",
      notes:""
    };
    state.modalOpen = true;
    state.modalError = null;
    render();
  }
  function addMinutes(t, mins){
    const [h,m] = t.split(":").map(Number);
    const total = h*60+m+mins;
    const nh = Math.floor((total%1440)/60), nm = total%60;
    return pad(nh)+":"+pad(nm);
  }
  function closeModal(){
    state.modalOpen = false;
    state.editing = null;
    clearOverlay();
    render();
  }

  function renderModal(){
    const overlay = el('div',{class:'overlay open', onclick:(e)=>{ if(e.target===overlay) closeModal(); }});
    const isNew = !state.events.find(e=>e.id===state.editing.id);
    const m = el('div',{class:'modal'});
    const header = el('div',{class:'modal-head'},[
      el('div',{class:'modal-title-wrap'},[el('span',{class:'modal-kicker'},[txt(isNew?'CREATE EVENT':'EDIT EVENT')]),el('h3',{},[txt(isNew? 'New event' : 'Edit event')])]),
      el('button',{class:'modal-close',type:'button','aria-label':'Close',onclick:()=>closeModal()},[txt('×')])
    ]);
    m.appendChild(header);

    const titleField = el('div',{class:'field'},[
      el('label',{},[txt('Title')]),
      el('input',{type:'text', id:'f-title', value: state.editing.title, placeholder:'e.g. Design review'})
    ]);
    m.appendChild(titleField);

    m.appendChild(el('div',{class:'field'},[
      el('label',{},[txt('Date')]),
      el('input',{type:'date', id:'f-date', value: state.editing.date})
    ]));

    m.appendChild(el('div',{class:'row2'},[
      el('div',{class:'field'},[
        el('label',{},[txt('Starts')]),
        el('input',{type:'time', id:'f-start', value: state.editing.start})
      ]),
      el('div',{class:'field'},[
        el('label',{},[txt('Ends')]),
        el('input',{type:'time', id:'f-end', value: state.editing.end})
      ]),
    ]));

    if(state.modalError){
      m.appendChild(el('div',{class:'err'},[txt(state.modalError)]));
    }

    const catField = el('div',{class:'field'},[el('label',{},[txt('Category')])]);
    const picker = el('div',{class:'cat-picker'});
    Object.keys(CATS).forEach(k=>{
      const opt = el('div',{
        class:'cat-opt'+(state.editing.category===k?' selected':''),
        onclick:()=>{ state.editing.category=k; render(); }
      },[
        el('span',{class:'sw swatch-'+CATS[k].cls}),
        txt(CATS[k].label)
      ]);
      picker.appendChild(opt);
    });
    catField.appendChild(picker);
    m.appendChild(catField);

    m.appendChild(el('div',{class:'field'},[
      el('label',{},[txt('Notes')]),
      el('textarea',{id:'f-notes', placeholder:'Optional details…'},[txt(state.editing.notes||"")])
    ]));

    const actions = el('div',{class:'modal-actions'});
    const leftActions = el('div',{},[]);
    if(!isNew){
      leftActions.appendChild(el('button',{class:'btn btn-danger', onclick:async()=>{
        if(!confirm('Delete this event? This cannot be undone.')) return;
        const btn = document.querySelector('.modal .btn-danger');
        if(btn){ btn.disabled=true; btn.textContent='Deleting…'; btn.style.opacity='.65'; btn.style.cursor='wait'; }
        const deleted = await deleteEvent(state.editing.id);
        if(deleted){
          state.modalOpen=false;
          state.editing=null;
          clearOverlay();
          showToast("Event deleted");
        }else{
          render();
        }
      }},[txt('Delete')]));
    }
    const rightActions = el('div',{style:'display:flex; gap:8px;'},[
      el('button',{class:'btn btn-ghost', type:'button', onclick:(e)=>{ e.preventDefault(); e.stopPropagation(); closeModal(); }},[txt('Cancel')]),
      el('button',{class:'btn btn-primary', type:'button', onclick: async(e)=>{ e.preventDefault(); await saveFromModal(); }},[txt('Save')]),
    ]);
    actions.appendChild(leftActions);
    actions.appendChild(rightActions);
    m.appendChild(actions);

    overlay.appendChild(m);

    setTimeout(()=> document.getElementById('f-title')?.focus(), 0);
    m.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

    return overlay;
  }

  async function saveFromModal(){
    const titleEl = document.getElementById('f-title');
    const dateEl = document.getElementById('f-date');
    const startEl = document.getElementById('f-start');
    const endEl = document.getElementById('f-end');
    const notesEl = document.getElementById('f-notes');

    const title = titleEl?.value.trim() || "";
    const date = dateEl?.value || "";
    const startTime = startEl?.value || "";
    const endTime = endEl?.value || "";
    const notes = notesEl?.value || "";

    if(!title){
      state.modalError = "Give this event a title.";
      render();
      setTimeout(()=>document.getElementById('f-title')?.focus(),0);
      return;
    }
    if(!date){
      state.modalError = "Pick a date.";
      render();
      return;
    }
    if(startTime && endTime && timeToMinutes(endTime) <= timeToMinutes(startTime)){
      state.modalError = "End time should be after the start time.";
      render();
      return;
    }

    const ev = { ...state.editing, title, date, start:startTime, end:endTime, notes };

    const saveBtn = document.querySelector('.modal .btn-primary');
    if(saveBtn){
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving…";
      saveBtn.style.opacity = ".65";
      saveBtn.style.cursor = "wait";
    }

    const saved = await upsertEvent(ev);

    if(!saved){
      render();
      return;
    }

    state.selectedDay = parseKey(date);
    state.cursor = new Date(state.selectedDay.getFullYear(), state.selectedDay.getMonth(), 1);
    state.modalOpen = false;
    state.editing = null;
    clearOverlay();
    showToast("Event saved");
  }


  async function handleGoogleLogin(){
    if(state.authBusy) return;

    // Update the existing button without re-rendering first. This keeps the
    // browser's trusted user-gesture context intact for the popup request.
    state.authBusy = true;
    state.authError = null;
    console.log("[Almanac Auth] Starting Google sign-in…");

    const btn = document.querySelector('[data-google-login="true"]');
    if(btn){
      btn.disabled = true;
      btn.textContent = "Connecting to Google…";
      btn.style.cursor = "wait";
      btn.setAttribute("aria-disabled","true");
    }

    console.log("[Almanac Auth] Google button clicked", {
      origin: location.origin,
      href: location.href,
      authDomain: firebaseConfig.authDomain,
      projectId: firebaseConfig.projectId
    });

    try{
      if(location.protocol === "file:"){
        throw Object.assign(
          new Error("Google sign-in needs a web origin. Please open Almanac through the included localhost launcher."),
          {code:"auth/web-origin-required"}
        );
      }

      googleProvider.setCustomParameters({prompt:"select_account"});

      // Keep this call directly inside the user's click handler.
      const result = await signInWithPopup(auth, googleProvider);

      console.log(
        "[Almanac Auth] Google sign-in succeeded",
        result?.user?.email || result?.user?.uid
      );
      state.authBusy = false;
    }catch(err){
      console.error("[Almanac Auth] Google sign-in failed:", err);
      state.authBusy = false;
      state.authError = friendlyAuthError(err);
      render();
    }
  }

  document.addEventListener("click", (e)=>{
    const btn = e.target.closest?.('[data-google-login="true"]');
    if(!btn) return;
    e.preventDefault();
    handleGoogleLogin();
  });

  document.addEventListener('keydown',e=>{
    if(e.target && ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if(e.key.toLowerCase()==='n'){e.preventDefault();openModal(null,state.selectedDay);}
    else if(e.key.toLowerCase()==='t'){e.preventDefault();const t=new Date();state.cursor=new Date(t.getFullYear(),t.getMonth(),1);state.selectedDay=t;state.motion='today';render();}
    else if(e.key==='Escape' && state.drawerOpen){state.drawerOpen=false;render();}
  });

  onAuthStateChanged(auth, async (user)=>{
    state.modalOpen = false;
    state.editing = null;
    state.authError = null;
    state.authBusy = false;
    state.authInitializing = false;
    if(user){
      state.loaded = false;
      render();
      try{ await loadEvents(); }catch(err){
        console.error('Post-login calendar load failed:',err);
        state.toast = 'Signed in, but calendar data could not be loaded.';
      }
      render();
    }else{
      state.events = [];
      state.loaded = false;
      render();
    }
  });

  // live-update the now-line every minute
  setInterval(()=>{ if(state.view==='day' && !state.modalOpen) render(); }, 60000);

})();
</script>
</body>
